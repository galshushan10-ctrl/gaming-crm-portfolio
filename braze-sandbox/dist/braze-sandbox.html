<h2>The object model</h2>
<p>Nearly every mistake a new Braze user makes traces back to not knowing which of five objects they are touching. Learn these and most of the platform explains itself.</p>

</table>

<div class="bz-callout">
  <div class="bz-callout__t">The rule that decides attribute vs event</div>
  <p>If you would ever ask <em>"how many times?"</em> or <em>"when?"</em>, it is an <strong>event</strong>. If you only ever ask <em>"what is it now?"</em>, it is an <strong>attribute</strong>. <code>total_stays</code> is an attribute; <code>checked_out</code> is an event. Storing "last booking" only as an attribute throws away the history you will want six months later — and you cannot get it back retroactively.</p>

<h2>Custom event properties are not free</h2>
<p>You can segment on an event ("performed <code>booking_started</code> in the last 7 days") for the full retention window. But segmenting on an event <em>property</em> ("...where <code>city</code> = Eilat") is only available for a shorter window and is not available on every plan tier. Personalization inside the message body, however, can always read <code>{{event_properties.\${city}}}</code> for the event that triggered the send.</p>

<div class="bz-callout bz-callout--warn">
  <div class="bz-callout__t">This trips up every new hire</div>
  <p><code>{{event_properties.\${…}}}</code> only resolves for <strong>action-based</strong> campaigns and Canvas entry — the message has to have been triggered by the event you are reading. Put it in a scheduled campaign and it renders empty for everyone.</p>

<h2>Campaign vs Canvas</h2>
<table>
  <tr><th></th><th>Campaign</th><th>Canvas</th></tr>

  <tr><td>Use when</td><td>Single send: a newsletter, a flash sale, one triggered reminder</td><td>Sequence with waits, branching, or several messages</td></tr>
  <tr><td>Testing</td><td>A/B variants on one message</td><td>Experiment Paths across whole branches</td></tr>
  <tr><td>Reporting</td><td>Per-message</td><td>Per-step, plus whole-journey conversion</td></tr>
</table>
<p>Practical guidance you will hear from any Braze CSM: if it has a <em>wait</em> in it, build it as a Canvas. Re-building a campaign into a Canvas later loses the historical stats, so start in the right place.</p>

<h2>Workspaces and environments</h2>
<p>A <strong>workspace</strong> (formerly "app group") holds one user base, its API keys and its data. Most hotel groups run at least a production and a staging workspace. Users do <em>not</em> cross workspaces — a test user in staging is a different person from the same email in production, and you cannot copy a segment between them (you can copy campaigns and Canvases).</p>

<h2>AND, OR, and filter groups</h2>
<p>Braze's <strong>Segment Builder 2.0</strong> supports nested boolean logic, and this is the single most common thing people get wrong — usually because they learned the old rules.</p>
<ul>
  <li><strong>Within a filter group</strong>, filters join with <strong>AND</strong> or <strong>OR</strong>.</li>
  <li><strong>Between filter groups</strong>, groups join with <strong>AND</strong> or <strong>OR</strong>.</li>
</ul>
<p>That gives you real nesting. "Gold or Platinum members who also have a stay in the next 7 days" is two groups:</p>
<pre><code>( loyalty_tier = Gold   OR   loyalty_tier = Platinum )
                    AND
( next_stay_date is in the next 7 days )</code></pre>

<div class="bz-callout bz-callout--warn">
  <div class="bz-callout__t">Advice you will still be given that is now wrong</div>
  <p>A great deal of Braze training, agency blog content and internal documentation says <em>"Braze segments are AND-only — there is no OR between filters, so use Audience Paths in a Canvas instead."</em> That was accurate for years, and it is why the workaround is so widely taught. It no longer describes the product.</p>
  <p>Do not correct a colleague aggressively on this one. They learned it when it was true. But do not build a three-Canvas workaround for something one OR now solves.</p>
</div>

<h3>When to use OR, and when not to</h3>
<p>Having OR does not mean reaching for it. A multi-value operator is usually cleaner:</p>
<table>
  <tr><th>Instead of</th><th>Write</th><th>Why</th></tr>
  <tr><td>Three rows joined by OR on <code>loyalty_tier</code></td><td><code>tier is any of [Gold, Platinum]</code></td><td>One row, reads as a sentence, and impossible to mis-join later</td></tr>
  <tr><td>OR across unrelated conditions in one group</td><td>Two filter groups joined by OR</td><td>Groups make the intent legible to whoever inherits it</td></tr>
</table>
<p>The old failure mode has not disappeared, it has just moved: two rows saying <code>tier = Gold</code> and <code>tier = Platinum</code> joined by <strong>AND</strong> still gives you <strong>zero</strong>, because nobody is both. Read every group aloud with its join word between the lines.</p>

<div class="bz-callout bz-callout--tip">
  <div class="bz-callout__t">Do this in the sandbox</div>
  <p>Open any segment and click a purple join badge to flip it between AND and OR. Watch the count move. Then add a second filter group and flip the badge between the groups — that is the nesting the old builder could not do.</p>
</div>

<h2>Segment vs filter-at-send-time</h2>
<p>You can target a saved segment, and then <em>add more filters</em> on the campaign itself. Use saved segments for audiences reused across many campaigns; use campaign-level filters for one-off narrowing. If you save a segment for every campaign you will have 300 segments in a year and no one will know which are live.</p>

<h2>Nested segments</h2>
<p>A filter can be "is in segment X" / "is not in segment Y". This is how you build exclusions cleanly — one <code>Suppression — complaints & bounces</code> segment referenced everywhere, rather than the same four filters copy-pasted into thirty campaigns. When the suppression rule changes you edit it once.</p>

<h2>Reachability is not audience size</h2>
<p>A segment of 40,000 does not mean 40,000 emails. Subtract: unsubscribed, hard-bounced, no email on file, and — critically — anyone unsubscribed from the relevant <strong>subscription group</strong>. Braze shows reachable counts per channel; check them before you promise a number to a stakeholder.</p>

<div class="bz-callout bz-callout--tip">
  <div class="bz-callout__t">Do this in the sandbox</div>
  <p>Open <strong>Audience → Segments → Booking abandoners — last 7 days</strong>. Remove the <code>Promotions &amp; Offers is subscribed</code> row and watch both the total and the email-reachable number move. The gap between them is your real send volume.</p>
</div>

<h2>Recency, frequency and the "did NOT do" filter</h2>
<p>The abandonment pattern is always the same shape and it is worth memorising:</p>
<pre><code>performed  booking_started        in the last 7 days   AND
did NOT perform booking_completed in the last 7 days   AND
Promotions &amp; Offers is subscribed</code></pre>
<p>The second row is what makes it correct. Without it you email people who already booked — the fastest way to lose the trust of the commercial team.</p>

<div class="bz-callout bz-callout--warn">
  <div class="bz-callout__t">The lookback windows must match</div>
  <p>If you write "started in last 7 days" AND "did not complete in last <strong>1</strong> day", someone who started on day 6 and completed on day 6 still qualifies — they did not complete <em>in the last day</em>. The exclusion window must be at least as long as the inclusion window. In a Canvas, an Action Path with an exception event is safer than a segment filter for exactly this reason.</p>
</div>
`,

<h2>Four namespaces, one syntax</h2>
<pre><code>{{\${first_name}}}                        standard attribute
{{custom_attribute.\${loyalty_tier}}}     custom attribute
{{event_properties.\${hotel_name}}}       property of the triggering event
{{canvas_entry_properties.\${promo}}}     property passed into Canvas entry
{{api_trigger_properties.\${offer_id}}}   property sent with an API-triggered campaign</code></pre>
<p>The <code>\${…}</code> wrapper is Braze's, not standard Liquid. Everything <em>outside</em> the wrapper is ordinary Liquid: filters, <code>if</code>, <code>for</code>, <code>assign</code>.</p>

<div class="bz-callout bz-callout--warn">
  <div class="bz-callout__t">Always set a fallback</div>
  <p><code>{{\${first_name}}}</code> on a profile with no first name renders nothing, and your greeting becomes "Hi ,". Write <code>{{\${first_name} | default: 'there'}}</code>. In a hotel group with partner-channel bookings, 20–40% of profiles routinely have no first name — this is not an edge case.</p>
</div>

<h2>Conditional logic</h2>
<pre><code>{% if custom_attribute.\${loyalty_tier} == 'Platinum' %}
  Late checkout until 16:00 is already on your reservation.
{% elsif custom_attribute.\${loyalty_tier} == 'Gold' %}
  Ask at the desk about 14:00 checkout.
{% else %}
  Upgrade to Gold with two more stays this year.
{% endif %}</code></pre>
<p>Operators: <code>==</code> <code>!=</code> <code>&gt;</code> <code>&lt;</code> <code>&gt;=</code> <code>&lt;=</code> <code>contains</code>, combined with <code>and</code> / <code>or</code>. There are no parentheses in Liquid — if you need grouping, nest the <code>if</code> blocks or pre-compute with <code>{% assign %}</code>.</p>

<div class="bz-callout">
  <div class="bz-callout__t">Liquid truthiness will catch you out</div>
  <p>Only <code>nil</code> and <code>false</code> are falsy. An <strong>empty string is true</strong>, and <strong>0 is true</strong>. So <code>{% if custom_attribute.\${points_balance} %}</code> fires for someone with zero points. Test the value explicitly: <code>{% if custom_attribute.\${points_balance} &gt; 0 %}</code>.</p>
</div>

<h2>Filters worth knowing by heart</h2>
<table>
  <tr><th>Filter</th><th>Example</th><th>Result</th></tr>
  <tr><td><code>default</code></td><td><code>{{\${first_name} | default: 'there'}}</code></td><td>there</td></tr>
  <tr><td><code>date</code></td><td><code>{{custom_attribute.\${next_stay_date} | date: '%A, %B %e'}}</code></td><td>Monday, August 18</td></tr>
  <tr><td><code>number_with_delimiter</code></td><td><code>{{custom_attribute.\${points_balance} | number_with_delimiter}}</code></td><td>18,400</td></tr>
  <tr><td><code>divided_by</code> / <code>round</code></td><td><code>{{custom_attribute.\${points_balance} | divided_by: 100 | round}}</code></td><td>184</td></tr>
  <tr><td><code>upcase</code> / <code>capitalize</code></td><td><code>{{\${city} | capitalize}}</code></td><td>Tel aviv</td></tr>
  <tr><td><code>truncate</code></td><td><code>{{\${last_name} | truncate: 8}}</code></td><td>Papadop…</td></tr>
</table>
<p>Note <code>capitalize</code> lowercases the rest of the string — it will turn "Tel Aviv" into "Tel aviv". For names and cities, trust your data instead of forcing case.</p>

<h2>Computing with <code>assign</code></h2>
<pre><code>{% assign nights = custom_attribute.\${nights_booked} %}
{% assign to_gold = 5 | minus: custom_attribute.\${total_stays} %}
You are {{to_gold}} stay{% if to_gold > 1 %}s{% endif %} from Gold.</code></pre>
<p>That pluralisation pattern is worth stealing. Nothing looks more automated than "1 stays".</p>

<h2>Catalogs</h2>
<p>A catalog is a table you upload (or sync via API) that Liquid can join against — properties, rewards, room types. It keeps prices and images out of the template.</p>
<pre><code>{% catalog_items hotels {{custom_attribute.\${abandoned_hotel_id}}} %}
{% if items.size == 0 %}
  {% abort_message('No catalog row — skip this user') %}
{% endif %}
&lt;h1&gt;Still thinking about {{items[0].city}}?&lt;/h1&gt;
&lt;img src="{{items[0].image_url}}"&gt;
&lt;p&gt;From €{{items[0].price_from}} per night&lt;/p&gt;</code></pre>

<h2>The wizard, step by step</h2>
<ol>

<h2>The three delivery types</h2>
<table>
  <tr><th>Type</th><th>Entry</th><th>Use for</th></tr>
  <tr><td><strong>Scheduled</strong></td><td>At a time you pick; one-off or recurring</td><td>Newsletters, flash sales, monthly loyalty statements</td></tr>

</table>

  <p>On an action-based campaign you can set a delay and an <strong>exception event</strong>: "send 4 hours after <code>booking_started</code>, unless <code>booking_completed</code> happens first." This is a far better abandonment mechanism than a segment with a "did not perform" filter, because it is evaluated per user against their own clock rather than a fixed lookback window.</p>
</div>

<h2>Conversion events and the attribution window</h2>
<p>A conversion event is your success metric: the user did the thing within N hours/days of <em>receiving</em> the message. You can set up to four; the first is primary and is what the optimisation features use.</p>
<div class="bz-callout bz-callout--warn">

</div>

<h2>A/B testing</h2>
<p>Split traffic across variants and, optionally, hold out a <strong>control group</strong> that receives nothing. The control is what turns "this campaign converted at 3%" into "this campaign <em>caused</em> 1.2% more conversion than doing nothing" — which is the only number a CFO cares about.</p>

<h2>Entry: the decision that shapes everything downstream</h2>
<ul>
  <li><strong>Action-based entry</strong> — a custom event, a purchase, an attribute change, or entering a segment. Users trickle in continuously.</li>
  <li><strong>Scheduled entry</strong> — everyone in the target segment enters at once, one-off or recurring.</li>
  <li><strong>API-triggered entry</strong> — your backend calls <code>/canvas/trigger/send</code>, optionally with <code>canvas_entry_properties</code> readable throughout the whole journey.</li>
</ul>

<div class="bz-callout">
  <div class="bz-callout__t">Entry audience vs entry trigger</div>
  <p>These are two separate gates and both must pass. The <em>trigger</em> is what happens; the <em>entry audience</em> is a segment filter applied at that moment. "Performs <code>booking_completed</code>" AND "is in segment: has marketing consent". A user who triggers but fails the audience filter simply does not enter — and they do not get another chance until they trigger again.</p>
</div>

<h2>Re-eligibility</h2>
<p>Can a user go through this journey more than once? Defaults matter here:</p>
<ul>
  <li><strong>Onboarding</strong> — re-eligibility <em>off</em>. You are welcomed once.</li>
  <li><strong>Pre-arrival</strong> — re-eligibility <em>on</em>, with a short cooldown (1 day). Every booking should get its own pre-arrival sequence, and a frequent business traveller might book twice in a week.</li>
  <li><strong>Win-back</strong> — re-eligibility <em>on</em>, long cooldown (90 days). Otherwise a lapsed guest who ignores you gets a win-back offer every Tuesday forever.</li>
</ul>
<p>Getting this wrong is one of the few Braze mistakes that is genuinely hard to unwind, because the sends have already gone.</p>

<h2>The step types</h2>
<table>
  <tr><th>Step</th><th>What it does</th><th>Watch out for</th></tr>
  <tr><td><strong>Message</strong></td><td>Sends on one or more channels. Can carry its own delay and its own audience filter.</td><td>A step-level audience filter that nobody passes silently drops users out of the journey.</td></tr>
  <tr><td><strong>Delay</strong></td><td>Wait a duration, until a specific date/attribute, or until a time of day.</td><td>"Until 7 days before <code>next_stay_date</code>" does nothing for a user whose stay is in 3 days — they are past the gate and exit. Handle short-lead bookings on a separate path.</td></tr>
  <tr><td><strong>Action Paths</strong></td><td>Branch on what the user <em>does</em> within an evaluation window (default 1 day, max 31). Users are held at the step until they act or the window closes.</td><td>The window is a real wait. A 7-day Action Path means nobody moves for up to 7 days.</td></tr>
  <tr><td><strong>Audience Paths</strong></td><td>Branch on who the user <em>is</em>, evaluated the instant they arrive. No waiting.</td><td>Evaluated top-down, first match wins. Order your paths from most specific to least, and always include a catch-all.</td></tr>
  <tr><td><strong>Experiment Paths</strong></td><td>Randomly assign users to variant paths by percentage, with an optional control.</td><td>Assignment is sticky per user per Canvas. Changing the percentages mid-flight does not re-randomise existing users.</td></tr>
  <tr><td><strong>Webhook</strong></td><td>POSTs to any endpoint. Notify a CRM, add to a list, trigger a voucher.</td><td>Failures are mostly silent. Log on the receiving end; do not assume it fired.</td></tr>
  <tr><td><strong>Update User Profile</strong></td><td>Writes a custom attribute from inside the journey.</td><td>Extremely useful for state (<code>winback_stage = exhausted</code>) — and for creating loops if the attribute is also an entry trigger. Be careful.</td></tr>
</table>

<div class="bz-callout bz-callout--warn">
  <div class="bz-callout__t">Action Paths vs Audience Paths — the distinction interviewers ask about</div>
  <p><strong>Action Paths wait. Audience Paths do not.</strong> "Did they open the last email?" is an Action Path with a window. "Are they a Gold member?" is an Audience Path, answered instantly. Using an Action Path where an Audience Path belongs inserts an invisible multi-day delay into your journey and people cannot work out why the next message is late.</p>
</div>

<h2>Quiet hours and local time</h2>
<p>Send in the user's local time zone, and set quiet hours (e.g. 21:00–08:00). A message that lands at 03:00 gets deleted and reported as spam. Decide what happens to messages that fall into quiet hours: hold until the window opens, or skip. For a "your room is ready" alert you skip; for a promotion you hold.</p>

<h2>Reading the numbers on a Canvas</h2>
<p>Each step shows entered / sent / opened / clicked / converted. The number to watch is the <strong>drop between steps</strong>. If 42,000 enter and 14,000 reach step 3, either an Action Path window is expiring or a step-level audience filter is excluding people. Both are invisible unless you look.</p>

<div class="bz-callout bz-callout--tip">

</div>

<h2>Preview &amp; Test</h2>
<p>Every message composer has it. Three modes worth using in sequence:</p>
<ol>

  <li><strong>Preview as a specific user</strong> — search by <code>external_id</code> or email. This is how you check edge profiles: no first name, null tier, missing catalog id.</li>

<div class="bz-callout bz-callout--warn">
  <div class="bz-callout__t">Preview is not proof</div>
  <p>Preview renders Liquid against one profile. It does not test your <em>audience</em>, your delivery timing, your frequency caps or your conversion tracking. Plenty of campaigns preview perfectly and then send to the wrong 200,000 people.</p>

<p>Keep a standing list of adversarial test users and run every template against all of them:</p>
<ul>

<p>In this sandbox, <strong>Jonas Weber (AUR-100001)</strong> is deliberately hostile: Blue tier, zero stays, null <code>preferred_city</code>, null <code>points_balance</code> logic paths, and a live abandoned booking. If your template survives Jonas, it will survive production.</p>

<h2>The pre-launch checklist</h2>
<p>Run this every time. Out loud, if it is a big send.</p>
<ol>

<h2>Three layers of "can I email this person?"</h2>
<ol>
  <li><strong>Global email subscription state</strong> — <code>opted_in</code>, <code>subscribed</code>, or <code>unsubscribed</code>. <code>unsubscribed</code> blocks everything, always.</li>
  <li><strong>Subscription groups</strong> — per-topic consent: Promotions, Loyalty News, Trip Information, SMS Stay Updates. A guest can leave Promotions and still get pre-arrival instructions.</li>
  <li><strong>Campaign targeting</strong> — you still have to filter on the right group. Braze will not stop you sending a promotion to someone who left the Promotions group unless you build that filter or attach the campaign to that group.</li>
</ol>

<div class="bz-callout bz-callout--warn">
  <div class="bz-callout__t">The distinction that matters legally</div>
  <p><code>subscribed</code> means "has not opted out". <code>opted_in</code> means "actively said yes". Under GDPR — and Israeli spam law, which is stricter than most people assume — marketing to EU residents generally requires <code>opted_in</code>. Targeting "is not unsubscribed" is fine for service messaging and is a compliance problem for promotions in some markets. Know which of your markets require which, and if you are unsure, ask legal rather than guessing.</p>
</div>

<h2>Subscription groups in practice</h2>
<p>Structure them by what the guest cares about, not by your org chart:</p>
<ul>
  <li><strong>Promotions &amp; Offers</strong> — rate drops, flash sales. Highest churn; expect the most unsubscribes here, and that is healthy.</li>
  <li><strong>Loyalty News</strong> — tier changes, points expiry. Much lower churn; people want this.</li>
  <li><strong>Trip Information</strong> — pre-arrival, on-property, checkout. Nearly nobody opts out.</li>
</ul>
<p>The reason to separate them: a guest annoyed by weekly offers can leave <em>that</em> group instead of hitting the global unsubscribe. A single all-or-nothing list converts irritation into permanent loss. Give people the smaller exit.</p>

<h2>Bounces and list hygiene</h2>
<ul>
  <li><strong>Hard bounce</strong> — address does not exist. Braze suppresses automatically. Never re-add these.</li>
  <li><strong>Soft bounce</strong> — mailbox full, server down. Retried, then suppressed after repeated failure.</li>
  <li><strong>Spam complaint</strong> — treat as an unsubscribe, immediately and permanently. Complaint rate above 0.1% will get you throttled by mailbox providers; above 0.3% and you have a real problem.</li>
</ul>
<p>Suppress people who have not opened anything in 12 months. It feels like giving up on revenue; it is the single most effective thing you can do for inbox placement, because engagement is what Gmail and Outlook actually rank on. A smaller list that lands in the inbox beats a big one that lands in spam.</p>

<h2>Frequency capping</h2>
<p>Workspace-level rules: "no more than 2 promotional emails per user per 7 days", "no more than 1 push per day". Set them once and every campaign inherits them.</p>
<ul>
  <li>Mark transactional and service campaigns as <strong>exempt</strong>, or a busy promo week will suppress check-in instructions.</li>
  <li>Capping silently drops recipients. If a send goes out much smaller than expected, capping is the first thing to check.</li>
</ul>

<h2>Sender reputation basics you are expected to know</h2>
<ul>
  <li><strong>SPF, DKIM, DMARC</strong> must be configured on your sending domain. If you cannot say whether DMARC is at <code>p=none</code> or <code>p=reject</code>, find out.</li>
  <li>Use a <strong>subdomain</strong> for marketing (<code>offers.aureliahotels.com</code>) separate from transactional (<code>stay.aureliahotels.com</code>). A bad promotional week then cannot take down booking confirmations.</li>
  <li><strong>Warm up</strong> new sending domains gradually — a few thousand of your most-engaged users, growing over 2–4 weeks. Blasting 200k from a cold domain lands the lot in spam.</li>
</ul>
`,

/* ==========================================================================
   Braze Sandbox — shared UI helpers + persistent store
   ========================================================================== */

const BZUI = (function () {
  'use strict';

  /* ---------- escaping / formatting -------------------------------------- */

  const esc = (s) => String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  const num = (n) => Number(n || 0).toLocaleString('en-US');
  const pct = (n, d) => (d ? ((n / d) * 100).toFixed(1) : '0.0') + '%';
  const money = (n) => '€' + Number(n || 0).toLocaleString('en-US');

  function relTime(iso) {
    if (!iso) return '—';
    const d = (window.BZ.NOW - new Date(iso)) / 86400000;
    if (d < 0) return 'in ' + Math.round(-d) + 'd';
    if (d < 1) return 'today';
    if (d < 2) return 'yesterday';
    if (d < 30) return Math.round(d) + 'd ago';
    if (d < 365) return Math.round(d / 30) + 'mo ago';
    return Math.round(d / 365) + 'y ago';
  }

  const fmtDate = (iso) => (iso ? new Date(iso).toISOString().slice(0, 10) : '—');

  const initials = (u) => ((u.first_name || '?')[0] + (u.last_name || '')[0] || '').toUpperCase();

  /* ---------- small components -------------------------------------------- */

  function statusChip(status) {
    const map = { active: 'active', idle: 'idle', draft: 'draft', scheduled: 'scheduled',
                  stopped: 'stopped', paused: 'paused', archived: 'draft' };
    return `<span class="bz-chip bz-chip--${map[status] || 'draft'}"><span class="bz-chip__dot"></span>${esc(status)}</span>`;
  }

  function stat(label, value, delta, dir) {
    return `<div class="bz-stat">
      <div class="bz-stat__label">${esc(label)}</div>
      <div class="bz-stat__value">${esc(value)}</div>
      ${delta ? `<div class="bz-stat__delta ${dir || ''}">${esc(delta)}</div>` : ''}
    </div>`;
  }

  function bars(values, labels) {
    const max = Math.max.apply(null, values.concat([1]));
    return `<div class="bz-bars">${values.map((v, i) => `
      <div class="bz-bars__col" title="${esc((labels && labels[i]) || '')}: ${num(v)}">
        <div class="bz-bars__bar" style="height:${(v / max) * 100}%"></div>
        <div class="bz-bars__lbl">${esc((labels && labels[i]) || '')}</div>
      </div>`).join('')}</div>`;
  }

  function funnel(rows) {
    const max = Math.max.apply(null, rows.map((r) => r.value).concat([1]));
    return `<div class="bz-funnel">${rows.map((r) => `
      <div class="bz-funnel__row">
        <div class="bz-funnel__lbl">${esc(r.label)}</div>
        <div class="bz-funnel__track"><div class="bz-funnel__fill" style="width:${(r.value / max) * 100}%"></div></div>
        <div class="bz-funnel__val">${num(r.value)}${r.pct ? ' · ' + r.pct : ''}</div>
      </div>`).join('')}</div>`;
  }

  function tabs(items, active, hrefBuilder) {
    return `<div class="bz-tabs">${items.map((t) =>
      `<a class="bz-tab ${t.id === active ? 'is-active' : ''}" href="${hrefBuilder(t.id)}" style="text-decoration:none">${esc(t.label)}</a>`
    ).join('')}</div>`;
  }

  function empty(icon, text, action) {
    return `<div class="bz-empty"><div class="bz-empty__ico">${icon}</div><div>${esc(text)}</div>${action || ''}</div>`;
  }

  /* ---------- toast -------------------------------------------------------- */

  let toastTimer = null;
  function toast(msg) {
    let el = document.getElementById('bz-toast');
    if (!el) { el = document.createElement('div'); el.id = 'bz-toast'; el.className = 'bz-toast'; document.body.appendChild(el); }
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2200);
  }

  /* ---------- modal -------------------------------------------------------- */

  function modal(title, bodyHtml, footerHtml, wide) {
    close();
    const wrap = document.createElement('div');
    wrap.className = 'bz-modal__backdrop';
    wrap.id = 'bz-modal';
    wrap.innerHTML = `<div class="bz-modal ${wide ? 'bz-modal--wide' : ''}">
      <div class="bz-modal__head"><div class="bz-modal__title">${esc(title)}</div>
        <div class="bz-spacer"></div>
        <button class="bz-btn bz-btn--ghost bz-btn--sm" data-modal-close>✕</button></div>
      <div class="bz-modal__body">${bodyHtml}</div>
      ${footerHtml ? `<div class="bz-modal__foot">${footerHtml}</div>` : ''}
    </div>`;
    wrap.addEventListener('click', (e) => { if (e.target === wrap || e.target.hasAttribute('data-modal-close')) close(); });
    document.body.appendChild(wrap);
    return wrap;
  }
  function close() { const m = document.getElementById('bz-modal'); if (m) m.remove(); }

  /* ---------- persistent store -------------------------------------------- */
  /* User-created segments/campaigns/canvases/templates survive a reload.      */

  const KEY = 'braze-sandbox-v1';

  const Store = {
    load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        ['segments', 'campaigns', 'canvases', 'templates', 'contentBlocks'].forEach((k) => {
          (saved[k] || []).forEach((item) => {
            const i = window.BZ[k].findIndex((x) => x.id === item.id);
            if (i > -1) window.BZ[k][i] = item; else window.BZ[k].push(item);
          });
        });
      } catch (e) { /* corrupt store — ignore and carry on with seeds */ }
    },
    save() {
      try {
        const out = {};
        ['segments', 'campaigns', 'canvases', 'templates', 'contentBlocks'].forEach((k) => {
          out[k] = window.BZ[k].filter((x) => x._userCreated || x._edited);
        });
        localStorage.setItem(KEY, JSON.stringify(out));
      } catch (e) { toast('Could not save — browser storage is full or blocked.'); }
    },
    reset() { localStorage.removeItem(KEY); location.reload(); },
  };

  const uid = (prefix) => prefix + '-' + Math.random().toString(36).slice(2, 8);

  /* ---------- Liquid convenience ------------------------------------------ */

  function contentBlockMap() {
    const m = {};
    window.BZ.contentBlocks.forEach((b) => { m[b.name] = b.content; });
    return m;
  }

  function renderLiquid(tpl, user, extra) {
    return window.BZLiquid.render(tpl, window.BZLiquid.contextForUser(user, extra || {}), {
      contentBlocks: contentBlockMap(),
      catalogs: window.BZ.catalogs,
    });
  }

  /* Pick the event a template would most plausibly have been triggered by,
     so {{event_properties.${…}}} resolves the way it would in production.   */
  function triggerEventFor(user, eventName) {
    const ev = user.events.find((e) => e.name === eventName) ||
               user.events.find((e) => e.name === 'booking_started') ||
               user.events.find((e) => e.name === 'checked_out') ||
               user.events[0];
    return ev ? ev.properties : {};
  }

  return {
    esc, num, pct, money, relTime, fmtDate, initials,
    statusChip, stat, bars, funnel, tabs, empty,
    toast, modal, closeModal: close,
    Store, uid, contentBlockMap, renderLiquid, triggerEventFor,
  };
})();

window.BZUI = BZUI;


/* ===== js/canvas.js ===== */
/* ==========================================================================
   Braze Sandbox — Canvas Flow builder
   Renders a journey as a vertical lane with branching paths, lets you insert
   / configure / delete steps, and shows per-step stats like the real thing.
   ========================================================================== */

const BZCanvas = (function () {
  'use strict';
  const U = window.BZUI;

  /* ---------- step catalog ------------------------------------------------ */

  const STEP_TYPES = [
    { kind: 'message',          label: 'Message',             icon: '✉️', desc: 'Send on one or more channels.' },
    { kind: 'delay',            label: 'Delay',               icon: '⏱',  desc: 'Wait a duration, or until a date.' },
    { kind: 'action_paths',     label: 'Action Paths',        icon: '⚡', desc: 'Branch on what the user does, within a window.' },
    { kind: 'audience_paths',   label: 'Audience Paths',      icon: '👥', desc: 'Branch on who the user is. No waiting.' },
    { kind: 'experiment_paths', label: 'Experiment Paths',    icon: '🧪', desc: 'Random split with an optional control group.' },
    { kind: 'decision_split',   label: 'Decision Split',      icon: '⑂',  desc: 'Yes/no branch on a single polar question.' },
    { kind: 'agent',            label: 'Agent',               icon: '🤖', desc: 'Run an AI agent from the Agent Console; route on its output variable.' },
    { kind: 'feature_flag',     label: 'Feature Flag',        icon: '⚑',  desc: 'Turn a flag on or off for users reaching this step.' },
    { kind: 'webhook',          label: 'Webhook',             icon: '🔗', desc: 'POST to an external endpoint.' },
    { kind: 'update_user',      label: 'Update User Profile', icon: '📝', desc: 'Write a custom attribute mid-journey.' },
    { kind: 'exit',             label: 'Exit',                icon: '🚪', desc: 'End of the journey.' },
  ];
  const typeOf = (kind) => STEP_TYPES.find((t) => t.kind === kind) || { label: kind, icon: '●' };

  const BRANCH_KINDS = ['action_paths', 'audience_paths', 'experiment_paths', 'decision_split'];

  /* ---------- step tree helpers ------------------------------------------- */

  /* Walk every step in the tree, including inside paths. */
  function walk(steps, fn, parent) {
    steps.forEach((s, i) => {
      fn(s, steps, i, parent);
      (s.paths || []).forEach((p) => walk(p.steps, fn, s));
    });
  }

  function findStep(canvas, id) {
    let hit = null;
    walk(canvas.steps, (s, list, i) => { if (s.id === id) hit = { step: s, list, index: i }; });
    return hit;
  }

  function removeStep(canvas, id) {
    const f = findStep(canvas, id);
    if (f) f.list.splice(f.index, 1);
  }

  function newStep(kind) {
    const t = typeOf(kind);
    const s = { id: U.uid('st'), kind, name: t.label };
    if (kind === 'message')     Object.assign(s, { channel: 'Email', templateId: window.BZ.templates[0].id, delay: 'Immediately', stats: { sent: 0, opens: 0, clicks: 0, conv: 0 } });
    if (kind === 'delay')       s.config = { duration: '1 day' };
    if (kind === 'webhook')     s.config = { url: 'https://hooks.example.com/braze', method: 'POST' };
    if (kind === 'update_user') s.config = { attribute: 'journey_stage', value: 'reached' };
    if (kind === 'action_paths') {
      s.config = { window: '1 day' };
      s.paths = [{ label: 'Performed `booking_completed`', steps: [] }, { label: 'Everybody else', steps: [] }];
    }
    if (kind === 'audience_paths') {
      s.config = { evaluate: 'On entry to step' };
      s.paths = [{ label: 'Gold / Platinum', steps: [] }, { label: 'Everybody else', steps: [] }];
    }
    if (kind === 'decision_split') {
      s.config = { question: 'Is in segment: Aurelia Club — Gold & Platinum' };
      s.paths = [{ label: 'Yes', steps: [] }, { label: 'No', steps: [] }];
    }
    if (kind === 'agent') s.config = { agent: 'Content Optimizer', outputVar: 'agent_choice' };
    if (kind === 'feature_flag') s.config = { flagKey: 'new_checkout_flow', enabled: 'true' };
    if (kind === 'experiment_paths') {
      s.config = { control: 10 };
      s.paths = [{ label: 'Path 1 (45%)', steps: [] }, { label: 'Path 2 (45%)', steps: [] }, { label: 'Control — holdout (10%)', steps: [] }];
    }
    return s;
  }

  /* ---------- rendering ---------------------------------------------------- */

  function stepCard(s, selectedId) {
    const t = typeOf(s.kind);
    const cls = s.kind === 'action_paths' ? 'action'
      : s.kind === 'audience_paths' ? 'audience'
      : s.kind === 'experiment_paths' ? 'experiment'
      : s.kind === 'decision_split' ? 'action'
      : s.kind === 'agent' ? 'experiment'
      : s.kind === 'feature_flag' ? 'update'
      : s.kind === 'update_user' ? 'update' : s.kind;

    let meta = '';
    if (s.kind === 'message') {
      const tpl = window.BZ.templates.find((x) => x.id === s.templateId);
      meta = `${U.esc(s.channel)} · ${U.esc(s.delay || 'Immediately')}${tpl ? '<br>' + U.esc(tpl.name) : ''}`;
    } else if (s.kind === 'delay')       meta = U.esc(s.config.duration);
    else if (s.kind === 'action_paths')  meta = 'Evaluation window: ' + U.esc(s.config.window);
    else if (s.kind === 'audience_paths')meta = U.esc(s.config.evaluate);
    else if (s.kind === 'experiment_paths') meta = (s.paths || []).length + ' paths';
    else if (s.kind === 'webhook')       meta = U.esc(s.config.method + ' ' + s.config.url);
    else if (s.kind === 'update_user')   meta = U.esc(s.config.attribute + ' = ' + s.config.value);
    else if (s.kind === 'decision_split') meta = U.esc(s.config.question);
    else if (s.kind === 'agent')          meta = U.esc(s.config.agent + ' → ' + s.config.outputVar);
    else if (s.kind === 'feature_flag')   meta = U.esc(s.config.flagKey + ' = ' + s.config.enabled);

    const st = s.stats;
    const statsHtml = st && st.sent ? `<div class="bz-cvstep__stats">
      <div>sent<b>${U.num(st.sent)}</b></div>
      <div>open<b>${U.pct(st.opens, st.sent)}</b></div>
      <div>click<b>${U.pct(st.clicks, st.sent)}</b></div>
      <div>conv<b>${U.pct(st.conv, st.sent)}</b></div>
    </div>` : '';

    return `<div class="bz-cvstep bz-cvstep--${cls} ${s.id === selectedId ? 'is-selected' : ''}" data-step="${s.id}">
      <div class="bz-cvstep__bar"></div>
      <div class="bz-cvstep__body">
        <div class="bz-cvstep__kind">${t.icon} ${U.esc(t.label)}</div>
        <div class="bz-cvstep__name">${U.esc(s.name)}</div>
        ${meta ? `<div class="bz-cvstep__meta">${meta}</div>` : ''}
        ${statsHtml}
      </div>
    </div>`;
  }

  const connector = (afterId, pathRef) =>
    `<div class="bz-cvconn">
      <div class="bz-cvconn__line"></div>
      <button class="bz-cvaddbtn" data-add-after="${afterId || ''}" data-add-path="${pathRef || ''}" title="Add a step here">+</button>
      <div class="bz-cvconn__line"></div>
    </div>`;

  function renderLane(steps, selectedId, pathRef, editable) {
    let html = '';
    if (!steps.length) {
      html += editable ? `<div style="padding:4px 0">${connector('', pathRef)}</div>` : '<div class="bz-muted bz-small" style="padding:8px 0">No steps on this path.</div>';
      return `<div class="bz-cvlane">${html}</div>`;
    }
    steps.forEach((s, i) => {
      html += stepCard(s, selectedId);
      if (BRANCH_KINDS.includes(s.kind) && s.paths) {
        html += `<div class="bz-cvconn"><div class="bz-cvconn__line"></div></div>`;
        html += `<div class="bz-cvbranches">${s.paths.map((p, pi) => `
          <div class="bz-cvbranch">
            <div class="bz-cvbranch__label">${U.esc(p.label)}</div>
            ${renderLane(p.steps, selectedId, s.id + ':' + pi, editable)}
          </div>`).join('')}</div>`;
      }
      if (i < steps.length - 1 || editable) html += connector(s.id, pathRef);
    });
    return `<div class="bz-cvlane">${html}</div>`;
  }

  /* ---------- config panel -------------------------------------------------- */

  function entryPanel(canvas) {
    const e = canvas.entry;
    const seg = window.BZ.segments.find((s) => s.id === e.segmentId);
    const reach = seg ? window.BZSeg.reach(seg.filters) : null;
    return `
      <div class="bz-card__head"><div class="bz-card__title">Canvas entry</div></div>
      <div class="bz-card__body">
        <div class="bz-field">
          <label class="bz-label">Entry type</label>
          <select class="bz-select" data-entry="type">
            <option value="action_based" ${e.type === 'action_based' ? 'selected' : ''}>Action-based delivery</option>
            <option value="scheduled" ${e.type === 'scheduled' ? 'selected' : ''}>Scheduled delivery</option>
            <option value="api_triggered" ${e.type === 'api_triggered' ? 'selected' : ''}>API-triggered delivery</option>
          </select>
          <div class="bz-hint">Action-based: users trickle in as they act. Scheduled: the whole segment enters at once.</div>
        </div>
        <div class="bz-field">
          <label class="bz-label">Trigger</label>
          <input class="bz-input" data-entry="trigger" value="${U.esc(e.trigger)}">
        </div>
        <div class="bz-field">
          <label class="bz-label">Entry audience</label>
          <select class="bz-select" data-entry="segmentId">
            ${window.BZ.segments.map((s) => `<option value="${s.id}" ${s.id === e.segmentId ? 'selected' : ''}>${U.esc(s.name)}</option>`).join('')}
          </select>
          ${reach ? `<div class="bz-hint">${U.num(reach.count)} users match this segment right now (${reach.pct.toFixed(1)}% of the base). The trigger <em>and</em> this filter must both pass.</div>` : ''}
        </div>
        <div class="bz-field">
          <label class="bz-label">Entry Controls</label>
          <label class="bz-checkline"><input type="checkbox" data-entry="reelig" ${e.reeligibility.allow ? 'checked' : ''}>
            <span><strong>Allow users to re-enter Canvas</strong>${e.reeligibility.cooldown ? ' — cooldown ' + U.esc(e.reeligibility.cooldown) : ''}</span></label>
          <div class="bz-hint"><strong>Re-eligibility</strong> is whether a user may enter again <em>after exiting</em>, governed by that time window.
            It is a different setting from <strong>re-entry</strong>, which is whether a user already inside the Canvas may start a concurrent path.
            Conflating the two is a classic interview trip-up.</div>
          <div class="bz-hint">Off for onboarding. On with a short cooldown for anything tied to a booking. On with a long cooldown for win-back.</div>
        </div>
        <div class="bz-field">
          <label class="bz-label">Conversion events</label>
          ${e.conversionEvents.map((c) => `<div class="bz-filterrow">
            <span class="bz-chip ${c.primary ? 'bz-chip--purple' : ''}">${c.primary ? 'primary' : 'secondary'}</span>
            <code class="bz-mono bz-small">${U.esc(c.event)}</code>
            <span class="bz-muted bz-small">within ${U.esc(c.window)}</span>
          </div>`).join('')}
          <div class="bz-hint">Up to <strong>four</strong> conversion events per Canvas; the first is primary.
            The window must cover your real lag to conversion — too short under-credits, too long claims bookings you did not cause.</div>
        </div>
        <div class="bz-field">
          <label class="bz-label">Delivery settings</label>
          <label class="bz-checkline"><input type="checkbox" ${e.sendInUserTz ? 'checked' : ''} disabled><span>Send in the user's local time zone</span></label>
          <label class="bz-checkline"><input type="checkbox" checked disabled><span>Quiet hours ${U.esc(e.quietHours)}</span></label>
        </div>
      </div>`;
  }

  function stepPanel(canvas, step) {
    const t = typeOf(step.kind);
    let body = '';

    if (step.kind === 'message') {
      const tpl = window.BZ.templates.find((x) => x.id === step.templateId);
      body = `
        <div class="bz-field">
          <label class="bz-label">Channel</label>
          <select class="bz-select" data-cfg="channel">
            ${['Email', 'Push', 'SMS', 'In-App Message', 'Webhook'].map((c) => `<option ${c === step.channel ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="bz-field">
          <label class="bz-label">Template</label>
          <select class="bz-select" data-cfg="templateId">
            ${window.BZ.templates.map((x) => `<option value="${x.id}" ${x.id === step.templateId ? 'selected' : ''}>${U.esc(x.name)}</option>`).join('')}
          </select>
          ${tpl ? `<div class="bz-hint"><a href="#/templates/${tpl.id}">Open in the email editor →</a></div>` : ''}
        </div>
        <div class="bz-field">
          <label class="bz-label">Send time</label>
          <input class="bz-input" data-cfg="delay" value="${U.esc(step.delay || '')}" placeholder="Immediately / Send at 10:00 local">
        </div>`;
    } else if (step.kind === 'delay') {
      body = `<div class="bz-field">
          <label class="bz-label">Wait</label>
          <input class="bz-input" data-cfg="config.duration" value="${U.esc(step.config.duration)}">
          <div class="bz-hint">Absolute ("3 days") or relative to an attribute ("Until 7 days before <code>next_stay_date</code>"). A relative gate that is already in the past drops the user — handle short lead times on their own path.</div>
        </div>`;
    } else if (step.kind === 'action_paths') {
      body = `<div class="bz-field">
          <label class="bz-label">Evaluation window</label>
          <input class="bz-input" data-cfg="config.window" value="${U.esc(step.config.window)}">
          <div class="bz-hint">Users are held here until they act or the window closes (max 31 days). This is a real wait — never put a long one before your primary message.</div>
        </div>` + pathsEditor(step);
    } else if (step.kind === 'audience_paths') {
      body = `<div class="bz-field">
          <label class="bz-label">Evaluation</label>
          <input class="bz-input" data-cfg="config.evaluate" value="${U.esc(step.config.evaluate)}">
          <div class="bz-hint">Evaluated the moment the user arrives — no waiting. Paths are checked top-down and the first match wins, so order from most specific to least and always keep a catch-all last.</div>
        </div>` + pathsEditor(step);
    } else if (step.kind === 'experiment_paths') {
      body = `<div class="bz-field">
          <label class="bz-label">Control group (%)</label>
          <input class="bz-input" type="number" data-cfg="config.control" value="${U.esc(step.config.control)}">
          <div class="bz-hint">The holdout receives nothing. It is what turns "converted at 3%" into "caused 1.2pp more than doing nothing".</div>
        </div>` + pathsEditor(step);
    } else if (step.kind === 'decision_split') {
      body = `<div class="bz-field"><label class="bz-label">Question</label>
          <input class="bz-input" data-cfg="config.question" value="${U.esc(step.config.question)}">
          <div class="bz-hint">A Decision Split answers one yes/no question — segment membership, an attribute test, message engagement.
          For more than two outcomes use Audience Paths instead.</div>
        </div>` + pathsEditor(step);
    } else if (step.kind === 'agent') {
      body = `<div class="bz-field"><label class="bz-label">Agent</label>
          <select class="bz-select" data-cfg="config.agent">${['Content Optimizer', 'Send-Time Optimizer', 'Subject Line Writer'].map((a) =>
            `<option ${a === step.config.agent ? 'selected' : ''}>${a}</option>`).join('')}</select>
          <div class="bz-hint">Agents are built in the Agent Console and dropped into a Canvas here.</div></div>
        <div class="bz-field"><label class="bz-label">Output variable</label>
          <input class="bz-input" data-cfg="config.outputVar" value="${U.esc(step.config.outputVar)}">
          <div class="bz-hint">The agent writes its result here; a later Audience Paths step can route on it.</div></div>`;
    } else if (step.kind === 'feature_flag') {
      body = `<div class="bz-field"><label class="bz-label">Flag key</label>
          <input class="bz-input" data-cfg="config.flagKey" value="${U.esc(step.config.flagKey)}"></div>
        <div class="bz-field"><label class="bz-label">Set to</label>
          <select class="bz-select" data-cfg="config.enabled">${['true', 'false'].map((v) =>
            `<option ${v === step.config.enabled ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`;
    } else if (step.kind === 'webhook') {
      body = `<div class="bz-field"><label class="bz-label">Method</label>
          <select class="bz-select" data-cfg="config.method">${['POST', 'PUT', 'GET'].map((m) => `<option ${m === step.config.method ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
        <div class="bz-field"><label class="bz-label">URL</label>
          <input class="bz-input" data-cfg="config.url" value="${U.esc(step.config.url)}"></div>
        <div class="bz-hint">Webhook failures are largely silent. Log on the receiving end rather than assuming it fired.</div>`;
    } else if (step.kind === 'update_user') {
      body = `<div class="bz-field"><label class="bz-label">Attribute</label>
          <input class="bz-input" data-cfg="config.attribute" value="${U.esc(step.config.attribute)}"></div>
        <div class="bz-field"><label class="bz-label">Value</label>
          <input class="bz-input" data-cfg="config.value" value="${U.esc(step.config.value)}"></div>
        <div class="bz-hint">Useful for journey state. Careful: if this attribute is also an entry trigger somewhere, you have built a loop.</div>`;
    } else {
      body = '<div class="bz-muted bz-small">Nothing to configure on this step.</div>';
    }

    const st = step.stats;
    const statsBlock = st && st.sent ? `
      <div class="bz-card__head" style="border-top:1px solid var(--bz-line)"><div class="bz-card__title">Step performance</div></div>
      <div class="bz-card__body">
        ${U.funnel([
          { label: 'Sent', value: st.sent },
          { label: 'Opened', value: st.opens, pct: U.pct(st.opens, st.sent) },
          { label: 'Clicked', value: st.clicks, pct: U.pct(st.clicks, st.sent) },
          { label: 'Converted', value: st.conv, pct: U.pct(st.conv, st.sent) },
        ])}
      </div>` : '';

    return `
      <div class="bz-card__head">
        <div class="bz-card__title">${t.icon} ${U.esc(t.label)}</div>
        <div class="bz-spacer"></div>
        <button class="bz-btn bz-btn--sm bz-btn--danger" data-del-step="${step.id}">Delete</button>
      </div>
      <div class="bz-card__body">
        <div class="bz-field">
          <label class="bz-label">Step name</label>
          <input class="bz-input" data-cfg="name" value="${U.esc(step.name)}">
        </div>
        ${body}
      </div>
      ${statsBlock}`;
  }

  function pathsEditor(step) {
    return `<div class="bz-field">
      <label class="bz-label">Paths</label>
      ${(step.paths || []).map((p, i) => `<div class="bz-filterrow">
        <span class="bz-filterrow__and">${i + 1}</span>
        <input class="bz-input bz-input--sm" style="flex:1" data-path="${i}" value="${U.esc(p.label)}">
        <button class="bz-btn bz-btn--sm bz-btn--ghost bz-filterrow__x" data-del-path="${i}">✕</button>
      </div>`).join('')}
      <button class="bz-btn bz-btn--sm" data-add-pathrow="1">+ Add path</button>
    </div>`;
  }

  /* ---------- view ---------------------------------------------------------- */

  let selectedId = null;

  function view(canvasId) {
    const canvas = window.BZ.canvases.find((c) => c.id === canvasId);
    if (!canvas) return '<div class="bz-content">Canvas not found.</div>';

    const sel = selectedId ? findStep(canvas, selectedId) : null;
    const panel = sel ? stepPanel(canvas, sel.step) : entryPanel(canvas);

    return `
      <div class="bz-topbar">
        <a href="#/canvases" class="bz-btn bz-btn--ghost bz-btn--sm">←</a>
        <div>
          <div class="bz-topbar__title">${U.esc(canvas.name)}</div>
          <div class="bz-topbar__sub">${U.esc(canvas.description)}</div>
        </div>
        <div class="bz-topbar__spacer"></div>
        ${U.statusChip(canvas.status)}
        <button class="bz-btn bz-btn--sm" data-act="canvas-entry">Entry settings</button>
        <button class="bz-btn bz-btn--primary bz-btn--sm" data-act="canvas-launch">${canvas.status === 'active' ? 'Stop Canvas' : 'Launch Canvas'}</button>
      </div>
      <div class="bz-canvasflow">
        <div class="bz-canvasflow__board" id="bz-board">
          <div class="bz-cvstep bz-cvstep--entry" data-step="__entry" style="${selectedId ? '' : 'border-color:var(--bz-purple);box-shadow:0 0 0 3px var(--bz-purple-soft)'}">
            <div class="bz-cvstep__bar"></div>
            <div class="bz-cvstep__body">
              <div class="bz-cvstep__kind">▶ Entry</div>
              <div class="bz-cvstep__name">${U.esc(canvas.entry.trigger)}</div>
              <div class="bz-cvstep__meta">${U.esc((window.BZ.segments.find((s) => s.id === canvas.entry.segmentId) || {}).name || '')}</div>
              ${canvas.stats.entered ? `<div class="bz-cvstep__stats">
                <div>entered<b>${U.num(canvas.stats.entered)}</b></div>
                <div>converted<b>${U.pct(canvas.stats.converted, canvas.stats.entered)}</b></div>
                <div>revenue<b>${U.money(canvas.stats.revenue)}</b></div></div>` : ''}
            </div>
          </div>
          ${connector('__entry', '')}
          ${renderLane(canvas.steps, selectedId, '', true)}
        </div>
        <div class="bz-canvasflow__side" id="bz-cvpanel">${panel}</div>
      </div>`;
  }

  /* ---------- events -------------------------------------------------------- */

  function bind(root, canvasId, rerender) {
    const canvas = window.BZ.canvases.find((c) => c.id === canvasId);
    if (!canvas) return;
    const touch = () => { canvas._edited = true; U.Store.save(); };

    root.addEventListener('click', (e) => {
      const card = e.target.closest('[data-step]');
      const addBtn = e.target.closest('[data-add-after]');
      const delBtn = e.target.closest('[data-del-step]');
      const delPath = e.target.closest('[data-del-path]');
      const addPath = e.target.closest('[data-add-pathrow]');
      const act = e.target.closest('[data-act]');

      if (act) {
        if (act.dataset.act === 'canvas-entry') { selectedId = null; rerender(); }
        if (act.dataset.act === 'canvas-launch') {
          canvas.status = canvas.status === 'active' ? 'stopped' : 'active';
          touch(); U.toast('Canvas ' + canvas.status); rerender();
        }
        return;
      }
      if (delBtn) { removeStep(canvas, delBtn.dataset.delStep); selectedId = null; touch(); rerender(); return; }
      if (delPath) {
        const s = findStep(canvas, selectedId); if (!s) return;
        s.step.paths.splice(+delPath.dataset.delPath, 1); touch(); rerender(); return;
      }
      if (addPath) {
        const s = findStep(canvas, selectedId); if (!s) return;
        s.step.paths.push({ label: 'New path', steps: [] }); touch(); rerender(); return;
      }
      if (addBtn) { openPicker(canvas, addBtn.dataset.addAfter, addBtn.dataset.addPath, touch, rerender); return; }
      if (card) {
        selectedId = card.dataset.step === '__entry' ? null : card.dataset.step;
        rerender(); return;
      }
    });

    root.addEventListener('input', (e) => {
      const cfg = e.target.closest('[data-cfg]');
      const pathIn = e.target.closest('[data-path]');
      const entry = e.target.closest('[data-entry]');
      if (cfg) {
        const s = findStep(canvas, selectedId); if (!s) return;
        const path = cfg.dataset.cfg.split('.');
        let obj = s.step;
        for (let i = 0; i < path.length - 1; i++) obj = obj[path[i]] = obj[path[i]] || {};
        obj[path[path.length - 1]] = cfg.value;
        touch();
        /* live-update only the card, so the input keeps focus */
        const node = root.querySelector(`[data-step="${s.step.id}"]`);
        if (node) node.outerHTML = stepCard(s.step, selectedId);
        return;
      }
      if (pathIn) {
        const s = findStep(canvas, selectedId); if (!s) return;
        s.step.paths[+pathIn.dataset.path].label = pathIn.value; touch(); return;
      }
      if (entry) {
        const k = entry.dataset.entry;
        if (k === 'reelig') canvas.entry.reeligibility.allow = entry.checked;
        else canvas.entry[k] = entry.value;
        touch();
        if (k === 'segmentId' || k === 'trigger') rerender();
      }
    });
  }

  function openPicker(canvas, afterId, pathRef, touch, rerender) {
    const html = `<div class="bz-steppicker">${STEP_TYPES.map((t) =>
      `<button class="bz-steppicker__item" data-kind="${t.kind}">
        <div class="bz-steppicker__t">${t.icon} ${U.esc(t.label)}</div>
        <div class="bz-steppicker__d">${U.esc(t.desc)}</div>
      </button>`).join('')}</div>`;
    const m = U.modal('Add a step', html, '', false);
    m.addEventListener('click', (e) => {
      const b = e.target.closest('[data-kind]');
      if (!b) return;
      const step = newStep(b.dataset.kind);

      let list = canvas.steps, idx = canvas.steps.length;
      if (pathRef) {
        const [parentId, pi] = pathRef.split(':');
        const p = findStep(canvas, parentId);
        if (p) { list = p.step.paths[+pi].steps; idx = list.length; }
      }
      if (afterId && afterId !== '__entry') {
        const f = findStep(canvas, afterId);
        if (f) { list = f.list; idx = f.index + 1; }
      } else if (afterId === '__entry') {
        list = canvas.steps; idx = 0;
      }
      list.splice(idx, 0, step);
      selectedId = step.id;
      touch(); U.closeModal(); rerender();
    });
  }

  function select(id) { selectedId = id; }

  return { view, bind, select, STEP_TYPES, newStep, findStep };
})();

window.BZCanvas = BZCanvas;


/* ===== js/editor.js ===== */
/* ==========================================================================
   Braze Sandbox — email composer
   HTML + Liquid on the left, rendered-against-a-real-profile preview on the
   right, with the linter and the personalization palette in between.
   ========================================================================== */

const BZEditor = (function () {
  'use strict';
  const U = window.BZUI;

  let previewUserId = 'AUR-100000';
  let device = 'desktop';
  let pane = 'html';   // html | subject | settings

  const PERSO = [
    ['${first_name}', 'First name'],
    ['${last_name}', 'Last name'],
    ['${email_address}', 'Email'],
    ['${user_id}', 'external_id'],
    ['${city}', 'City'],
    ['${country}', 'Country'],
    ['custom_attribute.${loyalty_tier}', 'Tier'],
    ['custom_attribute.${points_balance}', 'Points'],
    ['custom_attribute.${next_stay_hotel}', 'Next hotel'],
    ['custom_attribute.${next_stay_date}', 'Next stay date'],
    ['custom_attribute.${nights_booked}', 'Nights'],
    ['custom_attribute.${total_stays}', 'Total stays'],
    ['custom_attribute.${preferred_city}', 'Preferred city'],
    ['custom_attribute.${abandoned_hotel_id}', 'Abandoned hotel id'],
    ['event_properties.${hotel_name}', 'Event: hotel'],
    ['event_properties.${nights}', 'Event: nights'],
    ['content_blocks.${aurelia_header}', 'Block: header'],
    ['content_blocks.${aurelia_footer}', 'Block: footer'],
    ['content_blocks.${tier_badge}', 'Block: tier badge'],
  ];

  const SNIPPETS = [
    ['Fallback', "{{${first_name} | default: 'there'}}"],
    ['If / elsif', "{% if custom_attribute.${loyalty_tier} == 'Platinum' %}\n  …\n{% elsif custom_attribute.${loyalty_tier} == 'Gold' %}\n  …\n{% else %}\n  …\n{% endif %}"],
    ['Date format', "{{custom_attribute.${next_stay_date} | date: '%A, %B %e'}}"],
    ['Number format', '{{custom_attribute.${points_balance} | number_with_delimiter}}'],
    ['Assign + plural', "{% assign n = custom_attribute.${nights_booked} %}\n{{n}} night{% if n != 1 %}s{% endif %}"],
    ['Catalog + guard', "{% catalog_items hotels {{custom_attribute.${abandoned_hotel_id}}} %}\n{% if items.size == 0 %}{% abort_message('no catalog row') %}{% endif %}\n{{items[0].name}} — from €{{items[0].price_from}}"],
    ['Loop', '{% for item in items %}{{item.name}}{% unless forloop.last %}, {% endunless %}{% endfor %}'],
    ['Connected Content', '{% connected_content https://api.example.com/rates :cache 300 :save rates %}\n{% if rates.rate %}From €{{rates.rate}}{% endif %}'],
  ];

  /* ---------- render -------------------------------------------------------- */

  /* Open each template against a profile it actually applies to — previewing a
     pre-arrival email against someone with no booking looks broken for a
     reason that has nothing to do with the template.                          */
  let pinnedTemplate = null;
  let forcedUser = null;      // set when arriving from a user profile
  function defaultUserFor(tpl) {
    if (!tpl.previewUser) return previewUserId;
    const hit = window.BZSeg.evaluate(tpl.previewUser)[0];
    return hit ? hit.external_id : previewUserId;
  }

  function view(templateId) {
    const tpl = window.BZ.templates.find((t) => t.id === templateId);
    if (!tpl) return '<div class="bz-content">Template not found.</div>';
    if (forcedUser) { previewUserId = forcedUser; forcedUser = null; pinnedTemplate = templateId; }
    else if (pinnedTemplate !== templateId) { pinnedTemplate = templateId; previewUserId = defaultUserFor(tpl); }
    const user = window.BZ.userById(previewUserId) || window.BZ.users[0];

    return `
      <div class="bz-topbar">
        <a href="#/templates" class="bz-btn bz-btn--ghost bz-btn--sm">←</a>
        <div>
          <div class="bz-topbar__title">${U.esc(tpl.name)}</div>
          <div class="bz-topbar__sub">Email template · Liquid renders live against the selected profile</div>
        </div>
        <div class="bz-topbar__spacer"></div>
        <select class="bz-select bz-select--sm" style="width:auto" id="bz-prevuser">
          ${window.BZ.users.slice(0, 40).map((u) => `<option value="${u.external_id}" ${u.external_id === previewUserId ? 'selected' : ''}>
            ${U.esc(u.first_name + ' ' + u.last_name)} · ${U.esc(u.custom.loyalty_tier)} · ${U.esc(u.external_id)}</option>`).join('')}
        </select>
        <button class="bz-btn bz-btn--sm" data-act="rand-user">🎲 Random</button>
        <button class="bz-btn bz-btn--sm" data-act="edge-user">⚠️ Edge case</button>
        <button class="bz-btn bz-btn--sm" data-act="liquid-ref">🔍 Liquid reference</button>
        <button class="bz-btn bz-btn--sm bz-btn--primary" data-act="send-test">Send test</button>
      </div>
      <div class="bz-editor" id="bz-editor">
        <div class="bz-editor__pane" style="flex:1.05">
          <div class="bz-editor__panehead">
            <button class="bz-btn bz-btn--sm ${pane === 'html' ? 'bz-btn--primary' : ''}" data-pane="html">Body HTML</button>
            <button class="bz-btn bz-btn--sm ${pane === 'subject' ? 'bz-btn--primary' : ''}" data-pane="subject">Subject &amp; sender</button>
            <button class="bz-btn bz-btn--sm ${pane === 'settings' ? 'bz-btn--primary' : ''}" data-pane="settings">Personalization</button>
          </div>
          ${pane === 'html' ? `<textarea class="bz-editor__code" id="bz-body" spellcheck="false">${U.esc(tpl.body)}</textarea>`
          : pane === 'subject' ? `<div style="padding:16px;overflow:auto">
              <div class="bz-field"><label class="bz-label">Subject line</label>
                <input class="bz-input bz-mono" id="bz-subject" value="${U.esc(tpl.subject)}"></div>
              <div class="bz-field"><label class="bz-label">Preheader</label>
                <input class="bz-input bz-mono" id="bz-preheader" value="${U.esc(tpl.preheader)}">
                <div class="bz-hint">Shown after the subject in most inboxes. Do not repeat the subject — use it to extend the sentence.</div></div>
              <div class="bz-field"><label class="bz-label">From name</label>
                <input class="bz-input" id="bz-fromname" value="${U.esc(tpl.fromName)}"></div>
              <div class="bz-field"><label class="bz-label">From address</label>
                <input class="bz-input" id="bz-fromemail" value="${U.esc(tpl.fromEmail)}">
                <div class="bz-hint">Marketing should send from a subdomain separate from transactional, so a bad promo week cannot take down booking confirmations.</div></div>
              <div class="bz-field"><label class="bz-label">Reply-to</label>
                <input class="bz-input" id="bz-replyto" value="${U.esc(tpl.replyTo)}"></div>
            </div>`
          : `<div style="padding:16px;overflow:auto">
              <div class="bz-field">
                <label class="bz-label">Personalization tags — click to insert</label>
                <div class="bz-persotags">${PERSO.map(([tag, label]) =>
                  `<button class="bz-persotag" data-insert="{{${tag}}}" title="${U.esc(label)}">{{${U.esc(tag)}}}</button>`).join('')}</div>
              </div>
              <div class="bz-field">
                <label class="bz-label">Liquid snippets</label>
                ${SNIPPETS.map(([label, code]) =>
                  `<button class="bz-btn bz-btn--sm bz-mb8" style="display:block;width:100%;text-align:left" data-insert="${U.esc(code)}">${U.esc(label)}</button>`).join('')}
              </div>
              <div class="bz-field">
                <label class="bz-label">Content Blocks</label>
                ${window.BZ.contentBlocks.map((b) => `<div class="bz-filterrow">
                  <code class="bz-mono bz-small">${U.esc(b.name)}</code>
                  <div class="bz-spacer"></div>
                  <button class="bz-btn bz-btn--sm" data-insert="{{content_blocks.\${${U.esc(b.name)}}}}">Insert</button>
                </div><div class="bz-hint bz-mb16">${U.esc(b.description)}</div>`).join('')}
              </div>
            </div>`}
        </div>
        <div class="bz-editor__pane">
          <div class="bz-editor__panehead">
            <span>Preview</span>
            <div class="bz-spacer"></div>
            <button class="bz-btn bz-btn--sm ${device === 'desktop' ? 'bz-btn--primary' : ''}" data-device="desktop">🖥 Desktop</button>
            <button class="bz-btn bz-btn--sm ${device === 'mobile' ? 'bz-btn--primary' : ''}" data-device="mobile">📱 Mobile</button>
          </div>
          <div class="bz-editor__preview" id="bz-preview"></div>
        </div>
      </div>`;
  }

  /* ---------- preview ------------------------------------------------------- */

  function renderPreview(tpl) {
    const host = document.getElementById('bz-preview');
    if (!host) return;
    const user = window.BZ.userById(previewUserId) || window.BZ.users[0];
    const evProps = U.triggerEventFor(user, tpl.id === 'tpl-poststay' ? 'checked_out' : 'booking_started');
    const opts = { event_properties: evProps };

    const body    = U.renderLiquid(tpl.body, user, opts);
    const subject = U.renderLiquid(tpl.subject, user, opts);
    const pre     = U.renderLiquid(tpl.preheader, user, opts);
    const lint    = window.BZLiquid.lint(tpl.body + '\n' + tpl.subject);

    const width = device === 'mobile' ? 390 : 640;
    const allErrors = body.errors.concat(subject.errors, pre.errors);
    const allWarn = Array.from(new Set(body.warnings.concat(subject.warnings)));

    let notes = '';
    if (body.aborted) {
      notes += `<div class="bz-liqerr"><strong>Send aborted for this user.</strong>\n{% abort_message %} fired: "${U.esc(body.aborted)}"\nIn production this user is skipped and counted as an abort in campaign analytics.</div>`;
    }
    if (allErrors.length) notes += `<div class="bz-liqerr"><strong>Liquid errors</strong>\n• ${allErrors.map(U.esc).join('\n• ')}</div>`;
    if (allWarn.length) {
      notes += `<div class="bz-liqerr" style="background:var(--bz-amber-soft);border-color:#EBD9B4;color:#7A4A00">
        <strong>Resolved to nothing for ${U.esc(user.first_name)} ${U.esc(user.last_name)}</strong>\n• ${allWarn.map(U.esc).join('\n• ')}\nAdd <code>| default:</code> or guard with {% if %}.</div>`;
    }
    if (lint.length) {
      notes += lint.map((i) => `<div class="bz-liqerr" style="${i.level === 'error' ? '' : 'background:var(--bz-bg-3);border-color:var(--bz-line-2);color:var(--bz-ink-2)'}">${U.esc(i.text)}</div>`).join('');
    }
    if (!notes && !body.aborted) notes = `<div class="bz-liqok">✓ Renders cleanly for ${U.esc(user.first_name)} ${U.esc(user.last_name)} — every tag resolved.</div>`;

    host.innerHTML = `
      ${notes}
      <div class="bz-mailhead" style="max-width:${width}px">
        <div class="bz-mailhead__row"><div class="bz-mailhead__k">From</div>
          <div class="bz-mailhead__v">${U.esc(tpl.fromName)} &lt;${U.esc(tpl.fromEmail)}&gt;</div></div>
        <div class="bz-mailhead__row"><div class="bz-mailhead__k">To</div>
          <div class="bz-mailhead__v">${U.esc(user.email)}</div></div>
        <div class="bz-mailhead__row"><div class="bz-mailhead__k">Subject</div>
          <div class="bz-mailhead__v bz-mailhead__subject">${U.esc(subject.html) || '<span class="bz-muted">(empty)</span>'}</div></div>
        <div class="bz-mailhead__row"><div class="bz-mailhead__k">Preview</div>
          <div class="bz-mailhead__v bz-muted">${U.esc(pre.html)}</div></div>
      </div>
      <div class="bz-editor__device" style="max-width:${width}px">
        <iframe class="bz-editor__frame" id="bz-frame" sandbox="allow-same-origin"></iframe>
      </div>`;

    const frame = document.getElementById('bz-frame');
    const doc = frame.contentDocument;
    doc.open();
    doc.write('<!doctype html><html><head><meta charset="utf-8"><base target="_blank"><style>body{margin:0;font-family:Helvetica,Arial,sans-serif}img{max-width:100%}</style></head><body>' + (body.aborted ? '' : body.html) + '</body></html>');
    doc.close();
    const fit = () => { try { frame.style.height = Math.max(200, doc.body.scrollHeight + 20) + 'px'; } catch (e) {} };
    fit(); setTimeout(fit, 60); setTimeout(fit, 400);
  }

  /* ---------- events -------------------------------------------------------- */

  function bind(root, templateId, rerender) {
    const tpl = window.BZ.templates.find((t) => t.id === templateId);
    if (!tpl) return;
    const touch = () => { tpl._edited = true; U.Store.save(); };

    renderPreview(tpl);

    root.addEventListener('input', (e) => {
      const id = e.target.id;
      const map = { 'bz-body': 'body', 'bz-subject': 'subject', 'bz-preheader': 'preheader', 'bz-fromname': 'fromName', 'bz-fromemail': 'fromEmail', 'bz-replyto': 'replyTo' };
      if (map[id]) { tpl[map[id]] = e.target.value; touch(); renderPreview(tpl); }
    });

    root.addEventListener('change', (e) => {
      if (e.target.id === 'bz-prevuser') { previewUserId = e.target.value; renderPreview(tpl); }
    });

    root.addEventListener('click', (e) => {
      const p = e.target.closest('[data-pane]');
      const d = e.target.closest('[data-device]');
      const ins = e.target.closest('[data-insert]');
      const act = e.target.closest('[data-act]');

      if (p) { pane = p.dataset.pane; rerender(); return; }
      if (d) { device = d.dataset.device; renderPreview(tpl); rerender(); return; }
      if (ins) {
        const ta = document.getElementById('bz-body');
        if (!ta) { U.toast('Switch to the Body HTML tab to insert.'); return; }
        const s = ta.selectionStart, txt = ins.dataset.insert;
        ta.value = ta.value.slice(0, s) + txt + ta.value.slice(ta.selectionEnd);
        ta.focus(); ta.selectionStart = ta.selectionEnd = s + txt.length;
        tpl.body = ta.value; touch(); renderPreview(tpl);
        return;
      }
      if (act) {
        if (act.dataset.act === 'rand-user') {
          previewUserId = window.BZ.users[Math.floor(Math.random() * window.BZ.users.length)].external_id;
          rerender(); return;
        }
        if (act.dataset.act === 'edge-user') {
          /* the profile most likely to break a template: nulls everywhere */
          const edge = window.BZ.users.find((u) => u.custom.total_stays === 0 && !u.custom.next_stay_hotel && !u.custom.preferred_city) || window.BZ.users[1];
          previewUserId = edge.external_id;
          U.toast('Previewing ' + edge.first_name + ' ' + edge.last_name + ' — zero stays, null attributes.');
          rerender(); return;
        }
        if (act.dataset.act === 'liquid-ref') {
          const R = window.BZLiquidRef;
          U.modal('Liquid reference', `
            <input class="bz-input bz-mb16" id="bz-lqm-search" placeholder="Search tags, filters and recipes…">
            <div id="bz-lqm-body" style="max-height:56vh;overflow:auto"></div>`,
            '<button class="bz-btn" data-modal-close>Close</button>', true);

          const render = (q) => {
            const hits = R.search(q);
            const item = (it, g) => `<div class="bz-lq__item">
              <div class="bz-lq__head"><span class="bz-lq__name">${U.esc(it.name)}</span>
                ${g ? `<span class="bz-tag">${U.esc(g)}</span>` : ''}
                <div class="bz-spacer"></div>
                <button class="bz-btn bz-btn--sm bz-btn--primary" data-lqm="${U.esc(it.snippet)}">Insert</button></div>
              <pre class="bz-lq__code">${U.esc(it.snippet)}</pre>
              ${it.desc ? `<div class="bz-lq__desc">${it.desc}</div>` : ''}</div>`;
            document.getElementById('bz-lqm-body').innerHTML = hits
              ? (hits.map((h) => item(h.item, h.group)).join('') || '<div class="bz-muted">No match.</div>')
              : R.GROUPS.map((g) => `<div class="bz-label bz-mt16">${U.esc(g.label)}</div>${g.items.map((it) => item(it)).join('')}`).join('');
          };
          render('');
          document.getElementById('bz-lqm-search').addEventListener('input', (ev) => render(ev.target.value));
          document.getElementById('bz-lqm-body').addEventListener('click', (ev) => {
            const btn = ev.target.closest('[data-lqm]');
            if (!btn) return;
            const ta = document.getElementById('bz-body');
            const snip = btn.dataset.lqm;
            if (ta) {
              const st = ta.selectionStart;
              ta.value = ta.value.slice(0, st) + snip + ta.value.slice(ta.selectionEnd);
              tpl.body = ta.value;
            } else {
              tpl.body += '\n' + snip;
            }
            touch(); U.closeModal(); rerender();
            U.toast('Inserted — check the preview');
          });
          return;
        }
        if (act.dataset.act === 'send-test') {
          const user = window.BZ.userById(previewUserId);
          const r = U.renderLiquid(tpl.body, user, { event_properties: U.triggerEventFor(user, 'booking_started') });
          U.modal('Send test', `
            <p class="bz-muted bz-small">In Braze this sends to a test user or a seed list. Here is exactly what would land in the inbox for
            <strong>${U.esc(user.first_name)} ${U.esc(user.last_name)}</strong> (${U.esc(user.external_id)}).</p>
            ${r.aborted ? `<div class="bz-liqerr">Aborted: ${U.esc(r.aborted)} — no email would be sent to this user.</div>`
              : `<div class="bz-hint bz-mb8">Rendered HTML (${r.html.length.toLocaleString()} characters)</div>
                 <textarea class="bz-textarea" style="min-height:280px" readonly>${U.esc(r.html)}</textarea>`}
          `, '<button class="bz-btn" data-modal-close>Close</button>', true);
          return;
        }
      }
    });
  }

  function setPreviewUser(id) { forcedUser = id; }

  return { view, bind, renderPreview, setPreviewUser };
})();

      I('Abandoned booking hero', "{% catalog_items hotels {{custom_attribute.\${abandoned_hotel_id}}} %}\n{% if items.size == 0 %}{% abort_message('no catalog row') %}{% endif %}\n<h1>Still thinking about {{items[0].city}}?</h1>\n<img src=\"{{items[0].image_url}}\" alt=\"{{items[0].name}}\" width=\"600\">\n<p>From €{{items[0].price_from}} per night</p>", ''),
      I('Points-to-euros', "Your {{custom_attribute.\${points_balance} | number_with_delimiter}} points are worth about €{{custom_attribute.\${points_balance} | divided_by: 100.0 | round}}.",

      I('Countdown to arrival', "{% assign days = custom_attribute.\${next_stay_date} | date: '%s' | minus: 'now' | date: '%s' | divided_by: 86400 %}\n{% if days > 0 %}{{days}} days to go{% endif %}",
        'Date arithmetic via epoch seconds. Fiddly, but it is the standard trick.'),
      I('Alternating rows', "{% for item in items %}\n  <tr style=\"background:{% if forloop.index0 | modulo: 2 == 0 %}#FFFFFF{% else %}#F7F7FA{% endif %}\">\n    <td>{{item.name}}</td>\n  </tr>\n{% endfor %}", ''),
      I('Fallback chain', "{{custom_attribute.\${preferred_city} | default: custom_attribute.\${city} | default: 'your next destination'}}",
        'default can be chained — first non-empty wins.'),
    ]),
  ];

  /* Flat searchable index */
  function search(q) {
    q = String(q || '').toLowerCase().trim();
    if (!q) return null;
    const hits = [];
    GROUPS.forEach((g) => g.items.forEach((it) => {
      const hay = (it.name + ' ' + it.snippet + ' ' + it.desc + ' ' + g.label).toLowerCase();
      if (hay.includes(q)) hits.push({ group: g.label, item: it });
    }));
    return hits;
  }

  const allItems = () => GROUPS.reduce((a, g) => a.concat(g.items), []);

  return { GROUPS, search, allItems };
})();
