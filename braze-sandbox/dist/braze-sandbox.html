/* ===== js/htmleditor.js ===== */
/* ==========================================================================
   Braze Sandbox — HTML code editor
   Reproduces Braze's HTML editing experience: the CONTENT rail (Design and
   Build / Link Management / Gmail Promotion, then Personalization,
   Multi-language and Create with AI), the HTML | Classic | More tab strip, a
   line-numbered code pane, and a live Preview with "Expand Content Blocks".
   The Add Personalization modal and the full Liquid reference make this the
   place to practise tags.
   ========================================================================== */

const BZHtmlEditor = (function () {
  'use strict';
  const U = window.BZUI;

  let state = {
    section: 'design',        // design | links | gmail
    tab: 'html',              // html | classic | more
    expandBlocks: true,
    previewUserId: 'AUR-100000',
    liquidGroup: 'recipes',
    liquidQuery: '',
    showLiquid: false,
  };

  const RAIL = [
    { id: 'design', label: 'Design and Build' },
    { id: 'links',  label: 'Link Management' },
    { id: 'gmail',  label: 'Gmail Promotion' },
  ];

  /* ---------- line-numbered code pane -------------------------------------- */

  function codePane(code) {
    const lines = String(code || '').split('\n').length;
    return `<div class="bz-code">
      <div class="bz-code__gutter" id="bz-code-gutter">${Array.from({ length: lines }, (_, i) => i + 1).join('\n')}</div>
      <textarea class="bz-code__area" id="bz-code-area" spellcheck="false">${U.esc(code)}</textarea>
    </div>`;
  }

  /* ---------- Liquid reference panel ---------------------------------------- */

  function liquidPanel() {
    const R = window.BZLiquidRef;
    const hits = R.search(state.liquidQuery);

    const itemHtml = (it, groupLabel) => `<div class="bz-lq__item">
      <div class="bz-lq__head">
        <span class="bz-lq__name">${U.esc(it.name)}</span>
        ${groupLabel ? `<span class="bz-tag">${U.esc(groupLabel)}</span>` : ''}
        <div class="bz-spacer"></div>
        <button class="bz-btn bz-btn--sm bz-btn--primary" data-lq-insert="${U.esc(it.snippet)}">Insert</button>
        <button class="bz-btn bz-btn--sm" data-lq-copy="${U.esc(it.snippet)}">Copy</button>
      </div>
      <pre class="bz-lq__code">${U.esc(it.snippet)}</pre>
      ${it.desc ? `<div class="bz-lq__desc">${it.desc}</div>` : ''}
    </div>`;

    return `<div class="bz-lq">
      <div class="bz-lq__bar">
        <input class="bz-input bz-input--sm" id="bz-lq-search" placeholder="Search all Liquid tags, filters and recipes…" value="${U.esc(state.liquidQuery)}">
        <button class="bz-btn bz-btn--sm" data-act="he-liquid-close">✕</button>
      </div>
      ${hits ? `<div class="bz-lq__body">
          <div class="bz-hint bz-mb8">${hits.length} match${hits.length === 1 ? '' : 'es'}</div>
          ${hits.map((h) => itemHtml(h.item, h.group)).join('') || '<div class="bz-muted bz-small">Nothing matched. Try "date", "catalog", "default" or "loop".</div>'}
        </div>`
      : `<div class="bz-lq__groups">
          ${R.GROUPS.map((g) => `<button class="bz-lq__tab ${g.id === state.liquidGroup ? 'is-active' : ''}" data-lq-group="${g.id}">${U.esc(g.label)}</button>`).join('')}
        </div>
        <div class="bz-lq__body">
          ${(() => {
            const g = R.GROUPS.find((x) => x.id === state.liquidGroup) || R.GROUPS[0];
            return `${g.hint ? `<div class="bz-hint bz-mb8">${U.esc(g.hint)}</div>` : ''}
              ${g.items.map((it) => itemHtml(it)).join('')}`;
          })()}
        </div>`}
    </div>`;
  }

  /* ---------- preview -------------------------------------------------------- */

  function previewHtml(msg) {
    const user = window.BZ.userById(state.previewUserId) || window.BZ.users[0];
    const opts = { event_properties: U.triggerEventFor(user, 'booking_started') };
    const body = state.expandBlocks
      ? U.renderLiquid(msg.body, user, opts)
      : { html: U.esc(msg.body), errors: [], warnings: [], aborted: null };

    if (!String(msg.body || '').trim()) {
      return `<div class="bz-he__noprev">No content available for preview</div>`;
    }

    let notes = '';

    return `${notes}<div class="bz-he__paper">${body.aborted ? '' : body.html}</div>`;

  /* ---------- main view ------------------------------------------------------- */

        </div>`
      : `
        <div class="bz-he__pad">
          <div class="bz-field"><label class="bz-label">Subject line</label>
            <input class="bz-input bz-mono" data-msg="subject" value="${U.esc(msg.subject)}"></div>
          <div class="bz-field"><label class="bz-label">Preheader</label>
            <input class="bz-input bz-mono" data-msg="preheader" value="${U.esc(msg.preheader || '')}"></div>
          <div class="bz-field"><label class="bz-label">From name</label>
            <input class="bz-input" data-msg="fromName" value="${U.esc(msg.fromName)}"></div>
          <div class="bz-field"><label class="bz-label">From address</label>
            <input class="bz-input" data-msg="fromEmail" value="${U.esc(msg.fromEmail)}"></div>
          <div class="bz-field"><label class="bz-label">Reply-to</label>
            <input class="bz-input" data-msg="replyTo" value="${U.esc(msg.replyTo || '')}"></div>
        </div>`;

    return `<div class="bz-he">
      <div class="bz-he__rail">
        <div class="bz-he__railicons">
          <button class="bz-he__ricon is-active" title="Message">✉</button>
          <button class="bz-he__ricon" title="Edit">✎</button>
          <button class="bz-he__ricon" title="Preview">👁</button>
        </div>
        <div class="bz-he__railbody">
          <div class="bz-he__railtitle">Content</div>
          ${RAIL.map((r) => `<button class="bz-he__railitem ${r.id === state.section ? 'is-active' : ''}" data-he-section="${r.id}">${U.esc(r.label)}</button>`).join('')}

          <div class="bz-he__railgroup">
            <button class="bz-he__railaction" data-act="he-personalization">⊕ Personalization</button>
            <button class="bz-he__railaction" data-act="he-multilang">🌐 Multi-language</button>
          </div>

          <div class="bz-he__railtitle">Create with AI</div>
          <button class="bz-he__railaction bz-he__railaction--ai" data-act="he-liquid">✦ Liquid</button>
          <button class="bz-he__railaction bz-he__railaction--ai" data-act="he-copy">✎ Copy</button>
        </div>
      </div>

      <div class="bz-he__main">
        <div class="bz-he__tabs">
          <button class="bz-he__tab ${state.tab === 'html' ? 'is-active' : ''}" data-he-tab="html">HTML</button>
          <button class="bz-he__tab ${state.tab === 'classic' ? 'is-active' : ''}" data-he-tab="classic">✕ Classic</button>
          <button class="bz-he__tab ${state.tab === 'more' ? 'is-active' : ''}" data-he-tab="more">More ▾</button>
          <div class="bz-spacer"></div>
          <button class="bz-he__icon" data-act="he-multilang" title="Multi-language">🌐</button>
          <button class="bz-he__icon" data-act="he-media" title="Media library">🖼</button>
          <button class="bz-he__icon" data-act="he-liquid" title="Liquid reference">🔍</button>
        </div>

        <div class="bz-he__split">
          <div class="bz-he__left">
            ${state.tab === 'html' ? codePane(msg.body)
              : state.tab === 'classic' ? `<div class="bz-he__pad">
                  <div class="bz-callout"><div class="bz-callout__t">Classic (plain text)</div>
                    <p>The plain-text alternative part of the email. Some clients and most accessibility tooling read this instead of the HTML.</p></div>
                  <textarea class="bz-textarea" data-msg="plaintext" style="min-height:340px">${U.esc(msg.plaintext || '')}</textarea>
                  <button class="bz-btn bz-btn--sm bz-mt8" data-act="he-genplain">Generate from HTML</button>
                </div>`
              : `<div class="bz-he__pad">${sectionBody}</div>`}
          </div>

          <div class="bz-he__right">
            <div class="bz-he__prevbar">
              <span>Preview</span>
              <div class="bz-spacer"></div>
              <label class="bz-he__toggle">
                <input type="checkbox" data-he-bool="expandBlocks" ${state.expandBlocks ? 'checked' : ''}>
                <span>Expand Content Blocks</span>
              </label>
              <select class="bz-select bz-select--sm" style="width:auto" data-he-prevuser>
                ${window.BZ.users.slice(0, 30).map((u) => `<option value="${u.external_id}" ${u.external_id === state.previewUserId ? 'selected' : ''}>${U.esc(u.first_name + ' ' + u.last_name)} · ${U.esc(u.custom.loyalty_tier)}</option>`).join('')}
              </select>
            </div>
            <div class="bz-he__prevbody" id="bz-he-prev">${previewHtml(msg)}</div>
            <div class="bz-he__prevnote">Actual rendering may not be identical to this preview depending on the user's environment.</div>
          </div>
        </div>

        ${state.showLiquid ? liquidPanel() : ''}

        <div class="bz-he__foot">
          <button class="bz-btn bz-btn--sm bz-btn--ghost" data-act="he-oldeditor">⇄ Switch to old HTML editor</button>

          ${opts.doneLabel ? `<button class="bz-btn bz-btn--primary bz-btn--sm" data-act="he-done">${U.esc(opts.doneLabel)}</button>` : ''}
        </div>
      </div>
    </div>`;
  }

  /* ---------- Add Personalization modal --------------------------------------- */

  const PERSO_TYPES = {
    'Default Attributes': [
      ['first_name', "{{\${first_name}}}"], ['last_name', "{{\${last_name}}}"],
      ['email_address', "{{\${email_address}}}"], ['user_id', "{{\${user_id}}}"],
      ['country', "{{\${country}}}"], ['city', "{{\${city}}}"],
      ['language', "{{\${language}}}"], ['phone_number', "{{\${phone_number}}}"],
    ],
    'Custom Attributes': window.BZ.customAttributes.map((a) => [a.name, "{{custom_attribute.\${" + a.name + "}}}"]),
    'Event Properties': ['hotel_name', 'hotel_id', 'city', 'nights', 'total_price', 'check_in', 'rate_plan']
      .map((p) => [p, "{{event_properties.\${" + p + "}}}"]),
    'Canvas Entry Properties': ['promo_code', 'offer_id', 'source'].map((p) => [p, "{{canvas_entry_properties.\${" + p + "}}}"]),
    'Content Blocks': window.BZ.contentBlocks.map((b) => [b.name, "{{content_blocks.\${" + b.name + "}}}"]),
  };

  function personalizationModal(onInsert) {
    const types = Object.keys(PERSO_TYPES);
    const body = `
      <div class="bz-field">
        <label class="bz-label">Personalization type</label>
        <select class="bz-select" id="bz-p-type">${types.map((t) => `<option>${U.esc(t)}</option>`).join('')}</select>
      </div>
      <div class="bz-field">
        <label class="bz-label">Attribute</label>
        <select class="bz-select" id="bz-p-attr"></select>
      </div>
      <div class="bz-field">
        <label class="bz-label">Default value <span class="bz-muted">(Optional)</span> ⓘ</label>
        <input class="bz-input" id="bz-p-default" placeholder="Enter default value">
        <div class="bz-hint">Strongly recommended on anything that appears in a subject line or greeting.
          Without it a blank profile field renders "Hi ,".</div>
      </div>
      <div class="bz-field">
        <label class="bz-label">Liquid Snippet</label>
        <div class="bz-row">
          <input class="bz-input bz-mono" id="bz-p-snippet" readonly>
          <button class="bz-btn" id="bz-p-copy" title="Copy">⧉</button>
        </div>
      </div>`;

    const m = U.modal('Add Personalization', body,
      '<button class="bz-btn" data-modal-close>Cancel</button><button class="bz-btn bz-btn--primary" id="bz-p-insert">Insert</button>');

    const typeEl = m.querySelector('#bz-p-type');
    const attrEl = m.querySelector('#bz-p-attr');
    const defEl = m.querySelector('#bz-p-default');
    const snipEl = m.querySelector('#bz-p-snippet');

    function fillAttrs() {
      const list = PERSO_TYPES[typeEl.value] || [];
      attrEl.innerHTML = '<option value="">Search for an attribute</option>' +
        list.map(([name, snip]) => `<option value="${U.esc(snip)}">${U.esc(name)}</option>`).join('');
      build();
    }
    function build() {
      let s = attrEl.value || '';
      const d = defEl.value.trim();
      if (s && d) s = s.replace(/\}\}$/, " | default: '" + d.replace(/'/g, "\\'") + "'}}");
      snipEl.value = s;
    }
    typeEl.addEventListener('change', fillAttrs);
    attrEl.addEventListener('change', build);
    defEl.addEventListener('input', build);
    m.querySelector('#bz-p-copy').addEventListener('click', () => {
      if (navigator.clipboard && snipEl.value) navigator.clipboard.writeText(snipEl.value).catch(() => {});
      U.toast('Copied');
    });
    m.querySelector('#bz-p-insert').addEventListener('click', () => {
      if (!snipEl.value) { U.toast('Pick an attribute first'); return; }
      onInsert(snipEl.value);
      U.closeModal();
    });
    fillAttrs();
  }

  /* ---------- insertion helper ------------------------------------------------- */

  function insertAtCursor(msg, text, repaint) {
    const ta = document.getElementById('bz-code-area');
    if (!ta) { msg.body = (msg.body || '') + '\n' + text; repaint(true); return; }
    const start = ta.selectionStart, end = ta.selectionEnd;
    ta.value = ta.value.slice(0, start) + text + ta.value.slice(end);
    msg.body = ta.value;
    ta.focus();
    ta.selectionStart = ta.selectionEnd = start + text.length;
    repaint(false);
  }

  /* ---------- binding ----------------------------------------------------------- */

  function bind(root, msg, rerender) {
    const syncGutter = () => {
      const ta = document.getElementById('bz-code-area');
      const g = document.getElementById('bz-code-gutter');
      if (!ta || !g) return;
      const n = ta.value.split('\n').length;
      g.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
      g.scrollTop = ta.scrollTop;
    };
    const repaintPreview = () => {
      const el = document.getElementById('bz-he-prev');
      if (el) el.innerHTML = previewHtml(msg);
    };
    /* full=true means the DOM must be rebuilt (structure changed) */
    const repaint = (full) => { if (full) rerender(); else { syncGutter(); repaintPreview(); } };

    syncGutter();

    root.addEventListener('scroll', (e) => {
      if (e.target.id === 'bz-code-area') {
        const g = document.getElementById('bz-code-gutter');
        if (g) g.scrollTop = e.target.scrollTop;
      }
    }, true);

    root.addEventListener('input', (e) => {
      if (e.target.id === 'bz-code-area') { msg.body = e.target.value; repaint(false); return; }
      if (e.target.id === 'bz-lq-search') { state.liquidQuery = e.target.value; rerender(); return; }
      const mf = e.target.closest('[data-msg]');
      if (mf) { msg[mf.dataset.msg] = mf.value; repaintPreview(); return; }
      const hf = e.target.closest('[data-he]');
      if (hf) { msg[hf.dataset.he] = hf.value; return; }
    });

    root.addEventListener('change', (e) => {
      const b = e.target.closest('[data-he-bool]');
      if (b) {
        const k = b.dataset.heBool;
        if (k === 'expandBlocks') { state.expandBlocks = b.checked; repaintPreview(); }
        else msg[k] = b.checked;
        return;
      }
      if (e.target.hasAttribute('data-he-prevuser')) {
        state.previewUserId = e.target.value; repaintPreview(); return;
      }
    });

    root.addEventListener('click', (e) => {
      const q = (a) => e.target.closest('[' + a + ']');
      let t;

      if ((t = q('data-he-section'))) { state.section = t.dataset.heSection; state.tab = 'more'; rerender(); return; }
      if ((t = q('data-he-tab'))) { state.tab = t.dataset.heTab; rerender(); return; }
      if ((t = q('data-lq-group'))) { state.liquidGroup = t.dataset.lqGroup; rerender(); return; }
      if ((t = q('data-lq-insert'))) {
        if (state.tab !== 'html') { state.tab = 'html'; rerender(); }
        setTimeout(() => insertAtCursor(msg, t.dataset.lqInsert, repaint), 0);
        return;
      }
      if ((t = q('data-lq-copy'))) {
        if (navigator.clipboard) navigator.clipboard.writeText(t.dataset.lqCopy).catch(() => {});
        U.toast('Copied to clipboard');
        return;
      }

      const act = q('data-act');
      if (!act) return;
      switch (act.dataset.act) {
        case 'he-personalization':
          personalizationModal((snip) => {
            if (state.tab !== 'html') { state.tab = 'html'; rerender(); }
            setTimeout(() => insertAtCursor(msg, snip, repaint), 0);
          });
          break;
        case 'he-liquid':
          state.showLiquid = true; state.liquidQuery = ''; rerender(); break;
        case 'he-liquid-close':
          state.showLiquid = false; rerender(); break;
        case 'he-multilang':
          insertAtCursor(msg, "{% case \${language} %}\n  {% when 'he' %}שלום {{\${first_name}}}\n  {% when 'de' %}Hallo {{\${first_name}}}\n  {% else %}Hello {{\${first_name}}}\n{% endcase %}", repaint);
          break;
        case 'he-copy':
          U.modal('Create with AI — Copy', `<p class="bz-muted">In Braze this drafts subject lines and body copy with BrazeAI.</p>
            <p class="bz-muted bz-small">This sandbox has no model behind it, so nothing is generated here. The Liquid panel next to it is fully working — that is the part worth practising anyway.</p>`,
            '<button class="bz-btn" data-modal-close>Close</button>');
          break;
        case 'he-media':
          U.modal('Media Library', `<div class="bz-grid bz-grid--3">
            ${window.BZ.catalogs.hotels.items.slice(0, 6).map((h) => `<button class="bz-btn" style="padding:0;overflow:hidden;height:auto" data-lq-insert="${U.esc('<img src="' + h.image_url + '" alt="' + h.name + '" width="600" style="display:block;max-width:100%">')}">
              <img src="${U.esc(h.image_url)}" alt="" style="width:100%;display:block"></button>`).join('')}
          </div><div class="bz-hint bz-mt8">Click an image to insert it as an <code>&lt;img&gt;</code> tag.</div>`,
            '<button class="bz-btn" data-modal-close>Close</button>', true);
          break;
        case 'he-genplain':
          msg.plaintext = String(msg.body || '')
            .replace(/<style[\s\S]*?<\/style>/gi, '')
            .replace(/<[^>]+>/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
          rerender();
          break;
        case 'he-download': {
          const user = window.BZ.userById(state.previewUserId);
          const rendered = U.renderLiquid(msg.body, user, {}).html;
          U.modal('Download file', `<p class="bz-muted bz-small">Braze downloads the raw HTML. Here is both, so you can compare source with what a recipient receives.</p>
            <div class="bz-label bz-mt16">Source</div>
            <textarea class="bz-textarea" style="min-height:150px" readonly>${U.esc(msg.body)}</textarea>
            <div class="bz-label bz-mt16">Rendered for ${U.esc(user.first_name + ' ' + user.last_name)}</div>
            <textarea class="bz-textarea" style="min-height:150px" readonly>${U.esc(rendered)}</textarea>`,
            '<button class="bz-btn" data-modal-close>Close</button>', true);
          break;
        }
        case 'he-oldeditor':
          U.toast('The legacy editor is retired — this is the current one.');
          break;
      }
    });
  }

  return { view, bind, personalizationModal, state };
})();

/* ==========================================================================
   Braze Sandbox — Drag & Drop email editor
   Mirrors Braze's visual email builder: a block palette, a WYSIWYG canvas of
   rows and columns, and a property panel. The design compiles to real
   table-based email HTML, which then runs through the Liquid engine, so what
   you build here is previewable against an actual profile.
   ========================================================================== */

const BZEmailBuilder = (function () {

  const U = window.BZUI;

  /* ---------- design model -------------------------------------------------- */

    },
    social: {

      make: () => ({ type: 'social', id: U.uid('b'), align: 'center', padding: '12 24',
        links: [{ n: 'Facebook', u: 'https://facebook.com/aurelia' }, { n: 'Instagram', u: 'https://instagram.com/aurelia' }, { n: 'X', u: 'https://x.com/aurelia' }] }),
    },
  };

  /* Braze groups blocks into basic / media / advanced. */
  const CATEGORIES = [
    { id: 'basic',    label: 'Basic',    keys: ['title', 'paragraph', 'button', 'divider', 'spacer'] },
    { id: 'media',    label: 'Media',    keys: ['image', 'video', 'social', 'icons'] },
    { id: 'advanced', label: 'Advanced', keys: ['html', 'menu', 'content_block', 'product'] },
  ];

  /* ---------- compile design -> email HTML ---------------------------------- */

  const pad = (s) => {
    const p = String(s || '0').trim().split(/\s+/).map(Number);
    if (p.length === 1) return `${p[0]}px`;
    if (p.length === 2) return `${p[0]}px ${p[1]}px`;
    if (p.length === 3) return `${p[0]}px ${p[1]}px ${p[2]}px`;
    return `${p[0]}px ${p[1]}px ${p[2]}px ${p[3]}px`;
  };

  function blockHtml(b, st) {
    switch (b.type) {
      case 'title':
        return `<h${b.level} style="margin:0;padding:${pad(b.padding)};font-family:${st.fontFamily};font-size:${b.size}px;line-height:1.3;font-weight:700;color:${b.color || st.textColor};text-align:${b.align};">${b.text}</h${b.level}>`;
      case 'paragraph':
        return `<div style="padding:${pad(b.padding)};font-family:${st.fontFamily};font-size:${b.size}px;line-height:${b.lineHeight};color:${b.color || st.textColor};text-align:${b.align};">${b.html}</div>`;
      case 'image': {
        const img = `<img src="${b.src}" alt="${b.alt || ''}" width="${Math.round((st.contentWidth - 48) * (b.width / 100))}" style="display:block;max-width:100%;height:auto;border:0;border-radius:${b.radius}px;margin:${b.align === 'center' ? '0 auto' : b.align === 'right' ? '0 0 0 auto' : '0'};">`;
        return `<div style="padding:${pad(b.padding)};text-align:${b.align};">${b.href ? `<a href="${b.href}" target="_blank">${img}</a>` : img}</div>`;
      }
      case 'button':
        return `<div style="padding:${pad(b.padding)};text-align:${b.align};">
  <a href="${b.href}" target="_blank" style="display:inline-block;padding:${b.padV}px ${b.padH}px;border-radius:${b.radius}px;background:${b.bg};color:${b.color};font-family:${st.fontFamily};font-size:${b.size}px;font-weight:700;text-decoration:none;">${b.label}</a>
</div>`;
      case 'divider':
        return `<div style="padding:${pad(b.padding)};"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="border-top:${b.thickness}px solid ${b.color};font-size:0;line-height:0;">&nbsp;</td></tr></table></div>`;
      case 'spacer':
        return `<div style="height:${b.height}px;font-size:0;line-height:0;">&nbsp;</div>`;
      case 'html':
        return b.code;
      case 'content_block':
        return `{{content_blocks.\${${b.name}}}}`;
      case 'video':
        return `<div style="padding:${pad(b.padding)};text-align:${b.align};">
  <a href="${b.href}" target="_blank" style="display:inline-block;position:relative;text-decoration:none;">
    <div style="width:${st.contentWidth - 96}px;max-width:100%;height:190px;background:#1B1B22;border-radius:8px;color:#fff;font-family:${st.fontFamily};font-size:34px;line-height:190px;text-align:center;">▶</div>
    <div style="font-family:${st.fontFamily};font-size:13px;color:${st.linkColor};margin-top:8px;">${b.caption}</div>
  </a>
</div>`;
      case 'icons':
        return `<div style="padding:${pad(b.padding)};text-align:${b.align};font-family:${st.fontFamily};font-size:12.5px;color:${st.textColor};">
  ${b.items.map((i) => `<span style="display:inline-block;margin:0 12px;">◆<br>${i.label}</span>`).join('')}
</div>`;
      case 'menu':
        return `<div style="padding:${pad(b.padding)};text-align:${b.align};font-family:${st.fontFamily};font-size:13px;">
  ${b.items.map((i) => `<a href="${i.url}" style="color:${st.linkColor};text-decoration:none;margin:0 10px;">${i.label}</a>`).join('')}
</div>`;
      case 'product':
        return `{% catalog_items ${b.catalog} ${b.idExpr} %}
{% if items.size == 0 %}{% abort_message('No catalog row for this user') %}{% endif %}
<div style="padding:${pad(b.padding)};font-family:${st.fontFamily};">
  <img src="{{items[0].image_url}}" alt="{{items[0].name}}" width="${st.contentWidth - 48}" style="display:block;max-width:100%;border-radius:8px;">
  <div style="font-weight:700;font-size:16px;color:${st.textColor};margin-top:10px;">{{items[0].name}}</div>
  <div style="font-size:14px;color:${st.textColor};">{{items[0].city}} · from €{{items[0].price_from}} per night</div>
</div>`;
      case 'social':
        return `<div style="padding:${pad(b.padding)};text-align:${b.align};font-family:${st.fontFamily};font-size:13px;">
  ${b.links.map((l) => `<a href="${l.u}" style="color:${st.linkColor};text-decoration:none;margin:0 8px;">${l.n}</a>`).join('')}
</div>`;
      default: return '';
    }
  }

  function compile(design) {
    const st = design.settings;
    const rows = design.rows.map((r) => {
      const cells = r.columns.map((col) =>
        `<td width="${col.width}%" valign="top" style="width:${col.width}%;">${col.blocks.map((b) => blockHtml(b, st)).join('\n')}</td>`
      ).join('\n');
      const bg = r.background || st.contentBackground;
      return `<tr><td style="background:${bg};">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
${cells}
  </tr></table>
</td></tr>`;
    }).join('\n');

    return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:${st.pageBackground};">
<tr><td align="center" style="padding:0;">
<table role="presentation" width="${st.contentWidth}" cellpadding="0" cellspacing="0" border="0" style="width:${st.contentWidth}px;max-width:100%;background:${st.contentBackground};">
${rows}
</table>
</td></tr>
</table>`;
  }

  /* ---------- starter designs ----------------------------------------------- */

  function starterDesign(kind) {
    const d = newDesign();
    const row = (blocks, background) => ({ id: U.uid('r'), background, columns: [{ width: 100, blocks }] });

    const header = BLOCKS.content_block.make(); header.name = 'aurelia_header';
    const footer = BLOCKS.content_block.make(); footer.name = 'aurelia_footer';
    d.rows.push(row([header]));

    if (kind === 'blank') {
      const t = BLOCKS.paragraph.make();
      d.rows.push(row([t]));
    } else {
      const h = BLOCKS.title.make();
      const t = BLOCKS.paragraph.make();
      const img = BLOCKS.image.make();
      const btn = BLOCKS.button.make();
      img.src = window.BZ.catalogs.hotels.items[2].image_url;
      img.alt = 'Aurelia Club Eilat';
      t.html = "<p>Your dates are still available — from €210 per night. Members save an extra 10%, applied at checkout.</p>";
      d.rows.push(row([h, img, t, btn]));
    }
    d.rows.push(row([footer]));
    return d;
  }

  /* ---------- editor state --------------------------------------------------- */

  let selected = null;      // block id
  let selectedRow = null;   // row id
  let panelTab = 'content'; // content | rows | settings

  /* ---------- canvas rendering (editable preview) ---------------------------- */

  function canvasHtml(design) {
    const st = design.settings;
    if (!design.rows.length) {
      return `<div class="bz-eb__empty">
        <p><strong>Empty canvas.</strong></p>
        <p>Drag a block from the right, or click one to append it.</p>
      </div>`;
    }
    return design.rows.map((r, ri) => `
      <div class="bz-eb__row ${r.id === selectedRow ? 'is-selected' : ''}" data-row="${r.id}" style="background:${r.background || st.contentBackground}">
        <div class="bz-eb__rowbar">
          <span>Row ${ri + 1} · ${r.columns.length} col${r.columns.length > 1 ? 's' : ''}</span>
          <span class="bz-spacer"></span>
          <button class="bz-eb__mini" data-row-up="${r.id}" title="Move up">↑</button>
          <button class="bz-eb__mini" data-row-down="${r.id}" title="Move down">↓</button>
          <button class="bz-eb__mini" data-row-del="${r.id}" title="Delete row">✕</button>
        </div>
        <div class="bz-eb__cols">
          ${r.columns.map((col, ci) => `
            <div class="bz-eb__col" data-drop="${r.id}:${ci}" style="width:${col.width}%">
              ${col.blocks.map((b) => `
                <div class="bz-eb__block ${b.id === selected ? 'is-selected' : ''}" data-block="${b.id}">
                  <div class="bz-eb__blocktag">${U.esc(BLOCKS[b.type] ? BLOCKS[b.type].label : b.type)}</div>
                  <div class="bz-eb__blockctl">
                    <button class="bz-eb__mini" data-b-up="${b.id}" title="Move up">↑</button>
                    <button class="bz-eb__mini" data-b-down="${b.id}" title="Move down">↓</button>
                    <button class="bz-eb__mini" data-b-dup="${b.id}" title="Duplicate">⧉</button>
                    <button class="bz-eb__mini" data-b-del="${b.id}" title="Delete">✕</button>
                  </div>
                  ${blockHtml(b, st)}
                </div>`).join('')}
              ${col.blocks.length ? '' : '<div class="bz-eb__dropzone">Drop a block here</div>'}
            </div>`).join('')}
        </div>
      </div>`).join('');
  }

  /* ---------- property panel -------------------------------------------------- */

  const field = (label, inner, hint) =>
    `<div class="bz-field"><label class="bz-label">${U.esc(label)}</label>${inner}${hint ? `<div class="bz-hint">${hint}</div>` : ''}</div>`;
  const txt = (key, val, ph) => `<input class="bz-input bz-input--sm" data-prop="${key}" value="${U.esc(val ?? '')}" placeholder="${U.esc(ph || '')}">`;
  const area = (key, val) => `<textarea class="bz-textarea" data-prop="${key}" style="min-height:110px">${U.esc(val ?? '')}</textarea>`;
  const numf = (key, val, min, max) => `<input class="bz-input bz-input--sm" type="number" data-prop="${key}" value="${U.esc(val)}" min="${min ?? 0}" max="${max ?? 999}">`;
  const colorf = (key, val) => `<div class="bz-row"><input type="color" data-prop="${key}" value="${U.esc(val || '#000000')}" style="width:38px;height:30px;border:1px solid var(--bz-line-2);border-radius:5px;padding:2px;background:#fff">${txt(key, val)}</div>`;
  const sel = (key, val, opts) => `<select class="bz-select bz-select--sm" data-prop="${key}">${opts.map((o) => {
    const [v, l] = Array.isArray(o) ? o : [o, o];
    return `<option value="${U.esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${U.esc(l)}</option>`;
  }).join('')}</select>`;

  function blockProps(b) {
    switch (b.type) {
      case 'title': return field('Text', txt('text', b.text)) +
        field('Level', sel('level', b.level, [[1, 'H1'], [2, 'H2'], [3, 'H3']])) +
        field('Size (px)', numf('size', b.size, 10, 60)) +
        field('Align', sel('align', b.align, ['left', 'center', 'right'])) +
        field('Colour', colorf('color', b.color)) +
        field('Padding', txt('padding', b.padding, 'top right bottom left'), 'Space-separated, CSS order.');
      case 'paragraph': return field('Content (HTML)', area('html', b.html), 'Liquid works here — try <code>{{custom_attribute.${loyalty_tier}}}</code>.') +
        field('Size (px)', numf('size', b.size, 9, 32)) +
        field('Line height', txt('lineHeight', b.lineHeight)) +
        field('Align', sel('align', b.align, ['left', 'center', 'right', 'justify'])) +
        field('Colour', colorf('color', b.color)) +
        field('Padding', txt('padding', b.padding));
      case 'image': return field('Source', txt('src', b.src), 'A URL, or Liquid such as <code>{{items[0].image_url}}</code> after a catalog lookup.') +
        field('Alt text', txt('alt', b.alt), 'Required — many clients block images by default.') +
        field('Link to', txt('href', b.href, 'https://…')) +
        field('Width (%)', numf('width', b.width, 10, 100)) +
        field('Corner radius', numf('radius', b.radius, 0, 40)) +
        field('Align', sel('align', b.align, ['left', 'center', 'right'])) +
        field('Padding', txt('padding', b.padding));
      case 'button': return field('Label', txt('label', b.label)) +
        field('Link', txt('href', b.href)) +
        field('Background', colorf('bg', b.bg)) +
        field('Text colour', colorf('color', b.color)) +
        field('Corner radius', numf('radius', b.radius, 0, 40)) +
        field('Font size', numf('size', b.size, 10, 26)) +
        field('Padding X / Y', `<div class="bz-row">${numf('padH', b.padH, 4, 80)}${numf('padV', b.padV, 4, 40)}</div>`) +
        field('Align', sel('align', b.align, ['left', 'center', 'right'])) +
        field('Outer padding', txt('padding', b.padding));
      case 'divider': return field('Colour', colorf('color', b.color)) +
        field('Thickness', numf('thickness', b.thickness, 1, 10)) +
        field('Padding', txt('padding', b.padding));
      case 'spacer': return field('Height (px)', numf('height', b.height, 2, 160));
      case 'html': return field('HTML', area('code', b.code), 'Escape hatch for anything the visual blocks cannot express.');
      case 'content_block': return field('Content Block', sel('name', b.name, window.BZ.contentBlocks.map((c) => c.name)),
        'Edit the block once under Content Blocks and every template using it updates.');
      case 'video': return field('Link', txt('href', b.href)) +
        field('Caption', txt('caption', b.caption)) +
        field('Align', sel('align', b.align, ['left', 'center', 'right'])) +
        field('Padding', txt('padding', b.padding));
      case 'icons': return field('Items', area('_icons', b.items.map((i) => i.label).join('\n')), 'One label per line.') +
        field('Align', sel('align', b.align, ['left', 'center', 'right'])) +
        field('Padding', txt('padding', b.padding));
      case 'menu': return field('Items', area('_menu', b.items.map((i) => i.label + ' | ' + i.url).join('\n')), 'One per line: <code>Label | URL</code>') +
        field('Align', sel('align', b.align, ['left', 'center', 'right'])) +
        field('Padding', txt('padding', b.padding));
      case 'product': return field('Catalog', sel('catalog', b.catalog, Object.keys(window.BZ.catalogs))) +
        field('Item id expression', txt('idExpr', b.idExpr), 'Liquid resolving to a catalog row id. The block ships with an <code>abort_message</code> guard already in place.') +
        field('Padding', txt('padding', b.padding));
      case 'social': return field('Links', area('_links', b.links.map((l) => l.n + ' | ' + l.u).join('\n')), 'One per line: <code>Name | URL</code>') +
        field('Align', sel('align', b.align, ['left', 'center', 'right'])) +
        field('Padding', txt('padding', b.padding));
      default: return '<p class="bz-muted bz-small">No properties.</p>';
    }
  }

  function panelHtml(design) {
    const b = selected ? findBlock(design, selected) : null;

    if (b) {
      return `<div class="bz-eb__panelhead">
          <strong>${U.esc(BLOCKS[b.block.type] ? BLOCKS[b.block.type].label : b.block.type)}</strong>
          <span class="bz-spacer"></span>
          <button class="bz-btn bz-btn--sm bz-btn--ghost" data-eb="deselect">Done</button>
        </div>
        <div class="bz-eb__panelbody">${blockProps(b.block)}</div>`;
    }

    const tabs = `<div class="bz-eb__paneltabs">
      ${[['content', 'Content'], ['rows', 'Rows'], ['settings', 'Settings']].map(([id, l]) =>
        `<button class="bz-eb__paneltab ${panelTab === id ? 'is-active' : ''}" data-ptab="${id}">${l}</button>`).join('')}
    </div>`;

    if (panelTab === 'content') {
      return tabs + `<div class="bz-eb__panelbody">
        <p class="bz-hint bz-mb8">Drag a block onto the canvas, or click to append it to the last row.</p>
        ${CATEGORIES.map((cat) => `
          <div class="bz-label bz-mt16">${U.esc(cat.label)}</div>
          <div class="bz-eb__palette">
            ${cat.keys.map((k) => `<div class="bz-eb__ptile" draggable="true" data-newblock="${k}">
              <div class="bz-eb__pico">${BLOCKS[k].icon}</div><div>${U.esc(BLOCKS[k].label)}</div>
            </div>`).join('')}
          </div>`).join('')}
        <div class="bz-callout bz-mt16" style="font-size:12.5px">
          <div class="bz-callout__t">Where Liquid goes</div>
          <p>Put conditionals, loops and Connected Content in an <strong>HTML</strong> block. Personalization tags work anywhere, but Braze recommends control flow live in HTML so the visual blocks stay intact.</p>
        </div>
        <div class="bz-field bz-mt16">
          <label class="bz-label">Personalization</label>
          <div class="bz-persotags">
            ${[['${first_name}', 'First name'], ['custom_attribute.${loyalty_tier}', 'Tier'],
               ['custom_attribute.${points_balance}', 'Points'], ['custom_attribute.${next_stay_hotel}', 'Next hotel'],
               ['custom_attribute.${next_stay_date}', 'Next stay date'], ['event_properties.${hotel_name}', 'Event: hotel']]
              .map(([t, l]) => `<button class="bz-persotag" data-copy="{{${t}}}" title="${U.esc(l)}">{{${U.esc(t)}}}</button>`).join('')}
          </div>
          <div class="bz-hint">Click to copy, then paste into any text or HTML block.</div>
        </div>`;
    }

    if (panelTab === 'rows') {
      return tabs + `<div class="bz-eb__panelbody">
        <p class="bz-hint bz-mb8">Add a row, then drop blocks into its columns.</p>
        <div class="bz-eb__layouts">
          ${LAYOUTS.map((l) => `<button class="bz-eb__layout" data-newrow="${l.id}">
            <div class="bz-eb__layoutviz">${l.cols.map((w) => `<span style="flex:${w}"></span>`).join('')}</div>
            <div>${U.esc(l.label)}</div></button>`).join('')}
        </div>
        ${selectedRow ? (() => {
          const r = design.rows.find((x) => x.id === selectedRow);
          return r ? `<div class="bz-field bz-mt16"><label class="bz-label">Selected row background</label>${colorf('_rowbg', r.background || design.settings.contentBackground)}</div>` : '';
        })() : '<p class="bz-hint bz-mt16">Click a row on the canvas to style it.</p>'}
      </div>`;
    }

    const st = design.settings;
    return tabs + `<div class="bz-eb__panelbody">
      ${field('Content width (px)', numf('_s_contentWidth', st.contentWidth, 320, 900), 'Braze defaults to 600px. Anything wider risks clipping in Outlook.')}
      ${field('Page background', colorf('_s_pageBackground', st.pageBackground))}
      ${field('Content background', colorf('_s_contentBackground', st.contentBackground))}
      ${field('Font family', sel('_s_fontFamily', st.fontFamily, [
        ['Helvetica, Arial, sans-serif', 'Helvetica / Arial'],
        ['Georgia, serif', 'Georgia'],
        ['"Times New Roman", serif', 'Times New Roman'],
        ['Verdana, sans-serif', 'Verdana'],
        ['Tahoma, sans-serif', 'Tahoma'],
      ]), 'Web fonts are unreliable in email. Stick to a system stack.')}
      ${field('Default text colour', colorf('_s_textColor', st.textColor))}
      ${field('Link colour', colorf('_s_linkColor', st.linkColor))}
    </div>`;
  }

  /* ---------- tree helpers ----------------------------------------------------- */

  function findBlock(design, id) {
    for (const r of design.rows) for (const c of r.columns) {
      const i = c.blocks.findIndex((b) => b.id === id);
      if (i > -1) return { block: c.blocks[i], list: c.blocks, index: i, row: r };
    }
    return null;
  }

  function addBlock(design, kind, rowId, colIdx) {
    const b = BLOCKS[kind].make();
    let col;
    if (rowId != null) {
      const r = design.rows.find((x) => x.id === rowId);
      col = r && r.columns[colIdx];
    }
    if (!col) {
      if (!design.rows.length) design.rows.push({ id: U.uid('r'), columns: [{ width: 100, blocks: [] }] });
      col = design.rows[design.rows.length - 1].columns[0];
    }
    col.blocks.push(b);
    selected = b.id;
    return b;
  }

  function addRow(design, layoutId) {
    const l = LAYOUTS.find((x) => x.id === layoutId) || LAYOUTS[0];
    const r = { id: U.uid('r'), columns: l.cols.map((w) => ({ width: w, blocks: [] })) };
    design.rows.push(r);
    selectedRow = r.id;
    return r;
  }

  const move = (list, i, d) => {
    const j = i + d;
    if (j < 0 || j >= list.length) return;
    list.splice(j, 0, list.splice(i, 1)[0]);
  };

  /* ---------- public view ------------------------------------------------------- */

  function view(design) {
    return `<div class="bz-eb">
      <div class="bz-eb__canvaswrap" id="bz-eb-canvas">
        <div class="bz-eb__canvas" style="width:${design.settings.contentWidth}px;background:${design.settings.contentBackground}">
          ${canvasHtml(design)}
        </div>
      </div>
      <div class="bz-eb__panel" id="bz-eb-panel">${panelHtml(design)}</div>
    </div>`;
  }

  /* Wire up a rendered builder. onChange() is called after any mutation. */
  function bind(root, design, onChange) {
    let dragKind = null;

    root.addEventListener('dragstart', (e) => {
      const t = e.target.closest('[data-newblock]');
      if (!t) return;
      dragKind = t.dataset.newblock;
      e.dataTransfer.effectAllowed = 'copy';
      try { e.dataTransfer.setData('text/plain', dragKind); } catch (err) { /* Safari */ }
    });
    root.addEventListener('dragover', (e) => {
      const z = e.target.closest('[data-drop]');
      if (!z || !dragKind) return;
      e.preventDefault();
      z.classList.add('is-over');
    });
    root.addEventListener('dragleave', (e) => {
      const z = e.target.closest('[data-drop]');
      if (z) z.classList.remove('is-over');
    });
    root.addEventListener('drop', (e) => {
      const z = e.target.closest('[data-drop]');
      if (!z || !dragKind) return;
      e.preventDefault();
      z.classList.remove('is-over');
      const [rowId, ci] = z.dataset.drop.split(':');
      addBlock(design, dragKind, rowId, Number(ci));
      dragKind = null;
      onChange();
    });

    root.addEventListener('click', (e) => {
      const q = (a) => e.target.closest('[' + a + ']');
      let t;

      if ((t = q('data-ptab'))) { panelTab = t.dataset.ptab; return onChange(); }
      if ((t = q('data-eb'))) { if (t.dataset.eb === 'deselect') { selected = null; return onChange(); } }
      if ((t = q('data-newblock'))) { addBlock(design, t.dataset.newblock); return onChange(); }
      if ((t = q('data-newrow'))) { addRow(design, t.dataset.newrow); return onChange(); }
      if ((t = q('data-copy'))) {
        const v = t.dataset.copy;
        if (navigator.clipboard) navigator.clipboard.writeText(v).catch(() => {});
        U.toast('Copied ' + v);
        return;
      }

      if ((t = q('data-row-del'))) { design.rows = design.rows.filter((r) => r.id !== t.dataset.rowDel); return onChange(); }
      if ((t = q('data-row-up'))) { move(design.rows, design.rows.findIndex((r) => r.id === t.dataset.rowUp), -1); return onChange(); }
      if ((t = q('data-row-down'))) { move(design.rows, design.rows.findIndex((r) => r.id === t.dataset.rowDown), 1); return onChange(); }

      if ((t = q('data-b-del'))) { const f = findBlock(design, t.dataset.bDel); if (f) f.list.splice(f.index, 1); selected = null; return onChange(); }
      if ((t = q('data-b-up'))) { const f = findBlock(design, t.dataset.bUp); if (f) move(f.list, f.index, -1); return onChange(); }
      if ((t = q('data-b-down'))) { const f = findBlock(design, t.dataset.bDown); if (f) move(f.list, f.index, 1); return onChange(); }
      if ((t = q('data-b-dup'))) {
        const f = findBlock(design, t.dataset.bDup);
        if (f) { const copy = JSON.parse(JSON.stringify(f.block)); copy.id = U.uid('b'); f.list.splice(f.index + 1, 0, copy); selected = copy.id; }
        return onChange();
      }

      if ((t = q('data-block'))) { selected = t.dataset.block; selectedRow = null; return onChange(); }
      if ((t = q('data-row'))) { selectedRow = t.dataset.row; selected = null; panelTab = 'rows'; return onChange(); }
    });

    /* property edits — patch in place so inputs keep focus, then repaint preview */
    const applyProp = (el) => {
      const key = el.dataset.prop;
      if (!key) return;
      let val = el.type === 'number' ? Number(el.value) : el.value;

      if (key.startsWith('_s_')) { design.settings[key.slice(3)] = val; return; }
      if (key === '_rowbg') { const r = design.rows.find((x) => x.id === selectedRow); if (r) r.background = val; return; }

      const f = selected && findBlock(design, selected);
      if (!f) return;
      if (key === '_icons') { f.block.items = String(val).split('\n').map((l) => l.trim()).filter(Boolean).map((label) => ({ label })); return; }
      if (key === '_menu') {
        f.block.items = String(val).split('\n').map((line) => {
          const [label, url] = line.split('|').map((x) => x.trim());
          return label ? { label, url: url || '#' } : null;
        }).filter(Boolean);
        return;
      }
      if (key === '_links') {
        f.block.links = String(val).split('\n').map((line) => {
          const [n, u] = line.split('|').map((s) => s.trim());
          return n ? { n, u: u || '#' } : null;
        }).filter(Boolean);
        return;
      }
      f.block[key] = val;
    };

    root.addEventListener('input', (e) => {
      if (!e.target.dataset.prop) return;
      applyProp(e.target);
      /* repaint only the canvas so the property inputs keep focus and caret */
      const wrap = root.querySelector('#bz-eb-canvas .bz-eb__canvas');
      if (wrap) {
        wrap.style.width = design.settings.contentWidth + 'px';
        wrap.style.background = design.settings.contentBackground;
        wrap.innerHTML = canvasHtml(design);
      }
      onChange(true);   // true = canvas already repainted, skip full re-render
    });
    root.addEventListener('change', (e) => {
      if (!e.target.dataset.prop) return;
      if (e.target.tagName === 'SELECT' || e.target.type === 'color') { applyProp(e.target); onChange(); }
    });
  }

  const select = (id) => { selected = id; };
  const reset = () => { selected = null; selectedRow = null; panelTab = 'content'; };

  return { newDesign, starterDesign, compile, view, bind, select, reset, BLOCKS, CATEGORIES, LAYOUTS, findBlock };
})();

    { id: 'line', label: 'LINE', icon: '🟩', group: 'Single channel',

  /* ---------- device previews ------------------------------------------------------ */

  function renderFor(text, user, extra) {
    return U.renderLiquid(String(text || ''), user, extra || {}).html;
  }

  function pushPreview(m, user) {
    const title = renderFor(m.title, user), alert = renderFor(m.alert, user);
    return `<div class="bz-device bz-device--phone">
      <div class="bz-device__screen bz-device__screen--lock">
        <div class="bz-lock__time">9:41</div>

      </div>
    </div>`;
  }

  /* GSM-7 fits 160 chars per segment; any character outside it forces UCS-2
     and drops the limit to 70. A curly apostrophe is enough to do it.       */
  const NON_GSM = /[^\u0000-\u007F]/;

  function smsPreview(m, user) {
    const body = renderFor(m.body, user);
    const chars = body.length;
    const segments = Math.ceil(chars / (NON_GSM.test(body) ? 70 : 160)) || 1;
    return `<div class="bz-device bz-device--phone">
      <div class="bz-device__screen">
        <div class="bz-sms__hdr">${U.esc(m.senderId || 'AURELIA')}</div>

      <span>${segments} segment${segments > 1 ? 's' : ''}</span>

    </div>
    ${segments > 1 ? `<div class="bz-callout bz-callout--warn bz-mt8"><div class="bz-callout__t">Costs ${segments}×</div>

    ${!/stop/i.test(body) ? `<div class="bz-callout bz-callout--warn bz-mt8"><div class="bz-callout__t">No opt-out</div>

  function whatsappPreview(m, user) {

  function inappPreview(m, user) {

  function preview(m, user) {
    switch (m.channel) {
      case 'push': return pushPreview(m, user);
      case 'sms': return smsPreview(m, user);
      case 'whatsapp': return whatsappPreview(m, user);
      case 'inapp': return inappPreview(m, user);
      case 'contentcard': return contentCardPreview(m, user);
      case 'line': return `<div class="bz-device bz-device--phone"><div class="bz-device__screen" style="background:#8CABD8">
        <div class="bz-wa__hdr" style="background:#06C755">Aurelia Hotels<span>LINE Official Account</span></div>
        <div class="bz-wa__bubble">${U.esc(renderFor(m.body, user))}</div></div></div>`;
      case 'banner': return `<div style="border:1px solid var(--bz-line);border-radius:8px;overflow:hidden">
        <div style="background:var(--bz-bg-3);padding:6px 10px;font-size:11.5px;font-weight:700;color:var(--bz-ink-3)">Placement: ${U.esc(m.placement)}</div>
        <div>${U.renderLiquid(m.html, user, {}).html}</div></div>`;

      case 'line': return `
        ${f('Message type', `<select class="bz-select" data-msg="messageType">${['Text', 'Sticker', 'Image', 'Rich Menu'].map((t) =>
          `<option ${t === m.messageType ? 'selected' : ''}>${t}</option>`).join('')}</select>`)}
        ${f('Message', ta('body', m.body, 100))}`;

      case 'featureflag': return `<div class="bz-callout"><div class="bz-callout__t">${U.esc(m.flagKey)}</div>
        <p>${m.enabled ? 'Enabled' : 'Disabled'} for ${m.rollout}% of the target audience. No message is delivered.</p></div>`;
      default: return '';
    }
  }

  /* ---------- composer forms --------------------------------------------------------- */

  const f = (label, inner, hint) =>
    `<div class="bz-field"><label class="bz-label">${U.esc(label)}</label>${inner}${hint ? `<div class="bz-hint">${hint}</div>` : ''}</div>`;

  function composerForm(m) {
    switch (m.channel) {

        ${f('Deep link', inp('deepLink', m.deepLink, 'aurelia://…'), 'Send them to the exact screen. Dropping someone on the home screen wastes the tap.')}
        ${f('Button label', inp('_btn0', (m.buttons[0] || {}).text))}`;

      case 'sms': return `
        ${f('Message type', `<select class="bz-select" data-msg="smsType">${['SMS', 'MMS', 'RCS'].map((t) =>
          `<option ${t === m.smsType ? 'selected' : ''}>${t}</option>`).join('')}</select>`,
          'One channel family in Braze — you pick the flavour here rather than on the campaign type tile.')}
        ${f('Subscription group', `<select class="bz-select" data-msg="subscriptionGroup">${window.BZ.subscriptionGroups.filter((g) => g.channel === 'SMS').map((g) =>
          `<option value="${g.id}" ${g.id === m.subscriptionGroup ? 'selected' : ''}>${U.esc(g.name)}</option>`).join('')}</select>`,
          'SMS requires an explicit subscription group in Braze — it is not optional the way it is for email.')}
        ${f('Sender ID', inp('senderId', m.senderId))}
        ${f('Message', ta('body', m.body, 120), 'Count characters: 160 for GSM-7, 70 once any Unicode character appears — including a curly apostrophe.')}`;

      case 'whatsapp': return `
        ${f('Approved template', inp('templateName', m.templateName), 'Must already be approved by Meta. New copy means re-submission and a wait.')}
        ${f('Header', inp('header', m.header))}
        ${f('Body', ta('body', m.body, 100), 'Positional variables: <code>{{1}}</code>, <code>{{2}}</code>, <code>{{3}}</code>.')}
        ${f('Variable mapping', ta('_vars', (m.variables || []).join('\n'), 80), 'One Liquid expression per line, in order.')}
        ${f('Footer', inp('footer', m.footer))}`;

      case 'inapp': return `
        ${f('Message type', `<select class="bz-select" data-msg="messageType">${['Modal', 'Slideup', 'Full Screen', 'HTML Upload'].map((t) =>
          `<option ${t === m.messageType ? 'selected' : ''}>${t}</option>`).join('')}</select>`)}
        ${f('Title', inp('title', m.title))}
        ${f('Body', ta('body', m.body, 80))}

        ${f('Title', inp('title', m.title))}

          `<option ${t === m.messageType ? 'selected' : ''}>${t}</option>`).join('')}</select>`)}
        ${f('Message', ta('body', m.body, 100))}`;

      case 'featureflag': return `
        ${f('Flag key', inp('flagKey', m.flagKey))}
        ${f('Rollout (%)', `<input class="bz-input" type="number" data-msg="rollout" value="${m.rollout}" min="0" max="100">`)}
        ${f('State', `<label class="bz-checkline"><input type="checkbox" data-msg-bool="enabled" ${m.enabled ? 'checked' : ''}><span>Enabled</span></label>`)}`;

      default: return '';
    }
  }

  /* Apply a form edit to the message object. */
  function applyEdit(m, el) {
    const k = el.dataset.msg;
    if (k) {
      let v = el.type === 'number' ? Number(el.value) : el.value;
      if (k === '_btn0') { m.buttons = m.buttons || [{}]; m.buttons[0].text = v; return; }
      if (k === '_vars') { m.variables = String(v).split('\n').map((s) => s.trim()).filter(Boolean); return; }
      m[k] = v;
      return;
    }
    if (el.dataset.msgPlat) {
      const p = el.dataset.msgPlat;
      m.platforms = el.checked ? Array.from(new Set(m.platforms.concat([p]))) : m.platforms.filter((x) => x !== p);
      return;

   free-associate, and it says so when it does not know something.

  const COUNTRY = { israel: 'IL', israeli: 'IL', il: 'IL', germany: 'DE', german: 'DE', de: 'DE',
    uk: 'GB', britain: 'GB', british: 'GB', england: 'GB', gb: 'GB', spain: 'ES', spanish: 'ES', es: 'ES',
    italy: 'IT', italian: 'IT', it: 'IT', austria: 'AT', at: 'AT', greece: 'GR', gr: 'GR', netherlands: 'NL', nl: 'NL', france: 'FR', french: 'FR', fr: 'FR' };

  function extractFilters(q) {
    const f = [], why = [];
    const has = (re) => re.test(q);
    const numAfter = (re, dflt) => { const m = q.match(re); return m ? Number(m[1]) : dflt; };

    /* tiers */
    const tiers = ['Blue', 'Silver', 'Gold', 'Platinum'].filter((t) => q.includes(t.toLowerCase()));
    if (tiers.length) { f.push({ field: 'custom.loyalty_tier', op: 'is_one_of', value: tiers }); why.push(`tier is any of ${tiers.join(' / ')} — one filter with "is any of", not one row per tier`); }
    else if (has(/\b(vip|high value|top tier|best guests)\b/)) { f.push({ field: 'custom.loyalty_tier', op: 'is_one_of', value: ['Gold', 'Platinum'] }); why.push('read "VIP" as Gold + Platinum'); }

    /* country */
    for (const [word, code] of Object.entries(COUNTRY)) {
      if (new RegExp('\\b' + word + '\\b').test(q)) { f.push({ field: 'country', op: 'equals', value: code }); why.push(`country = ${code}`); break; }
    }

    /* lifecycle */
    if (has(/\blapsed|win.?back|haven'?t (stayed|been)|dormant|inactive\b/)) {
      const d = numAfter(/(\d+)\s*(?:\+\s*)?days?/, 180);
      f.push({ field: 'custom.total_stays', op: 'gte', value: 1 });
      f.push({ field: 'custom.last_stay_date', op: 'date_before_days_ago', value: d });
      why.push(`lapsed = has stayed before AND last stay more than ${d} days ago (the "has stayed before" row matters — without it you sweep in people who never booked)`);
    }
    if (has(/\bnever booked|no stays|prospect|registered but\b/)) {
      f.push({ field: 'custom.total_stays', op: 'equals', value: 0 }); why.push('total_stays = 0');
    }
    if (has(/\bupcoming|arriving|pre.?arrival|next stay|checking in\b/)) {
      const d = numAfter(/(?:next|within)\s*(\d+)\s*days?/, 14);
      f.push({ field: 'custom.next_stay_date', op: 'date_in_next_days', value: d }); why.push(`next_stay_date within ${d} days`);
    }
    if (has(/\babandon/)) {
      const d = numAfter(/(\d+)\s*days?/, 7);
      f.push({ field: 'event.booking_started', op: 'performed_in_last_days', value: d });
      f.push({ field: 'event.booking_completed', op: 'not_performed_in_last_days', value: d });
      why.push(`abandonment = started but did NOT complete, both over the same ${d}-day window (mismatched windows are the classic bug)`);
    }

    /* traits */
    if (has(/\b(famil|kids|children)\b/)) { f.push({ field: 'custom.travels_with_kids', op: 'is_true' }); why.push('travels_with_kids = true'); }
    if (has(/\bbusiness|corporate|midweek\b/)) { f.push({ field: 'custom.business_traveller', op: 'is_true' }); why.push('business_traveller = true'); }
    if (has(/\bspa\b/)) { f.push({ field: 'custom.spa_booker', op: 'is_true' }); why.push('spa_booker = true'); }
    if (has(/\bapp\b/)) { f.push({ field: 'custom.has_app', op: 'is_true' }); why.push('has_app = true'); }
    if (has(/\bpush\b/)) { f.push({ field: 'push_subscribe', op: 'equals', value: 'opted_in' }); why.push('push_subscribe = opted_in — note this is a *different* check from has_app'); }

    /* numeric thresholds */
    let m = q.match(/points?\s*(?:balance\s*)?(?:over|above|more than|>|at least|of)\s*([\d,]+)/);
    if (m) { const v = Number(m[1].replace(/,/g, '')); f.push({ field: 'custom.points_balance', op: 'gte', value: v }); why.push(`points_balance ≥ ${v}`); }
    m = q.match(/(?:ltv|lifetime value|spent)\s*(?:over|above|more than|>|at least|of)?\s*€?\s*([\d,]+)/);
    if (m) { const v = Number(m[1].replace(/,/g, '')); f.push({ field: 'custom.lifetime_value', op: 'gte', value: v }); why.push(`lifetime_value ≥ €${v}`); }
    m = q.match(/(?:at least|more than|over)\s*(\d+)\s*stays?/);
    if (m) { f.push({ field: 'custom.total_stays', op: 'gte', value: Number(m[1]) }); why.push(`total_stays ≥ ${m[1]}`); }

    /* consent — added automatically for anything promotional */
    if (has(/\boffer|promo|discount|sale|campaign|marketing|win.?back|abandon\b/)) {
      f.push({ field: 'subscription.sg-promos', op: 'equals', value: 'subscribed' });
      why.push('Promotions & Offers is subscribed — I add this to anything promotional; Braze will not enforce it for you');
    }
    return { filters: f, why };
  }

  /* ---------- Liquid snippet library --------------------------------------- */

  const SNIPPETS = [
    { keys: ['greet', 'hello', 'name', 'fallback', 'dear'], label: 'Safe greeting',

      note: 'Never discount a high-value guest when a points bonus will do. The <code>default</code> keeps the logic readable when someone adds a third branch later.' },
    { keys: ['night', 'plural', 'stay length', 'nights'], label: 'Plural-safe nights line',

      note: 'Note the verb pluralises the opposite way to the noun — "1 night starts", "3 nights start". Nothing looks more automated than "1 stays".' },

      note: 'strftime tokens. <code>%e</code> is space-padded day, <code>%-d</code> is unpadded.' },
    { keys: ['points', 'number', 'delimiter', 'currency'], label: 'Points and currency',

      note: 'Wrapped in an <code>if</code> so existing Gold members never see "you are -3 stays from Gold".' },
    { keys: ['loop', 'for', 'list', 'multiple'], label: 'Loop over catalog items',
      code: "{% for item in items %}\n  <a href=\"{{item.url}}\">{{item.name}}</a>{% unless forloop.last %}, {% endunless %}\n{% endfor %}",
      note: '<code>forloop.last</code> keeps you from a trailing comma.' },
    { keys: ['unsubscribe', 'footer', 'legal'], label: 'Unsubscribe link',
      code: "<a href=\"{{${set_user_to_unsubscribed_url}}}\">Unsubscribe</a>",
      note: 'Already inside the <code>aurelia_footer</code> Content Block — include that instead of hand-rolling it.' },
  ];

  /* ---------- helpers ------------------------------------------------------ */

  /* Leave-one-out: which single filter is costing the most audience? This is
     the answer to "my segment went to zero and I do not know why", which is
     otherwise a genuinely tedious thing to debug by hand.                    */
  function constraintReport(spec) {
    const filters = S.flat(spec);
    if (filters.length < 2) return '';
    const full = S.count(spec);
    const drops = filters.map((f, i) => ({
      f, n: S.count(filters.filter((_, j) => j !== i)),
    })).sort((a, b) => b.n - a.n);
    const worst = drops[0];
    if (worst.n <= full) return '';
    return `<p><strong>Which filter is the constraint?</strong> Dropping
      <code>${U.esc(S.describe(worst.f))}</code> takes it from ${U.num(full)} to <strong>${U.num(worst.n)}</strong>.</p>
      <table><tr><th>Remove this row</th><th>Count becomes</th></tr>
      ${drops.slice(0, 4).map((d) => `<tr><td><code>${U.esc(S.describe(d.f))}</code></td><td>${U.num(d.n)}</td></tr>`).join('')}</table>
      ${full === 0 ? '<p class="bz-small">Every row is ANDed, so a single over-tight condition zeroes the whole segment. Loosen the one at the top of that table first.</p>' : ''}`;
  }

  function say(html, did) {
    log.push({ role: 'op', html: html + (did ? `<div class="bz-op__did"><b>Done</b>${did}</div>` : '') });
  }
  const youSaid = (t) => log.push({ role: 'you', html: U.esc(t) });

  function score(q, keys) {
    let s = 0;
    keys.forEach((k) => { if (q.includes(k)) s += k.length > 6 ? 3 : 2; });
    return s;
  }

  /* ---------- the brain ----------------------------------------------------- */

  function respond(raw) {
    const q = raw.toLowerCase().trim();
    const c = ctx();
    if (!q) return;

    /* ===== ACTIONS (checked before knowledge, so "create X" never just explains X) */

    /* -- count / how many ------------------------------------------------- */
    if (/^(how many|count|what'?s the size|how big)/.test(q)) {
      const { filters, why } = extractFilters(q);
      if (!filters.length) {
        return say(`<p>I need something to count. Try <em>"how many Gold and Platinum members in Israel"</em> or <em>"how many users have the app"</em>.</p>`);
      }
      const r = S.reach(filters), rr = S.reachability(filters);
      return say(`<p><strong>${U.num(r.count)} users</strong> — ${r.pct.toFixed(1)}% of the ${U.num(r.total)} profiles in this workspace.</p>
        <table><tr><th>Channel</th><th>Reachable</th></tr>
        <tr><td>Email</td><td>${U.num(rr.email)}</td></tr>
        <tr><td>Push</td><td>${U.num(rr.push)}</td></tr>
        <tr><td>SMS</td><td>${U.num(rr.sms)}</td></tr></table>
        <p class="bz-small">Filters I used: ${filters.map((f) => `<code>${U.esc(S.describe(f))}</code>`).join(' AND ')}</p>
        <p class="bz-small">Report the <em>reachable</em> number, never the segment size.</p>`);
    }

    /* -- build a segment --------------------------------------------------- */
    if (/(build|create|make|set up|give me).{0,20}(segment|audience)|^segment (of|for)/.test(q)) {
      const { filters, why } = extractFilters(q);
      if (!filters.length) {
        return say(`<p>Tell me who should be in it and I will build it. I understand things like:</p>
          <ul><li>tiers — <em>Gold, Platinum, VIP</em></li><li>countries — <em>Israel, Germany, UK…</em></li>
          <li>lifecycle — <em>lapsed 180 days, never booked, arriving in 21 days, abandoners</em></li>
          <li>traits — <em>families, business travellers, app users, spa bookers</em></li>
          <li>thresholds — <em>points over 5000, LTV over 10000, at least 3 stays</em></li></ul>
          <p>e.g. <em>"build a segment of lapsed Gold members in Israel with the app"</em>.</p>`);
      }
      const seg = {
        id: U.uid('seg'), _userCreated: true, createdBy: 'BrazeAI Operator', tags: ['operator'],
        name: raw.replace(/^(build|create|make|set up|give me)\s+(me\s+)?(a\s+)?(segment|audience)\s*(of|for|with)?\s*/i, '').trim().slice(0, 60) || 'Operator segment',
        description: 'Built by the Operator from: "' + raw.trim() + '"',
        groups: [{ join: 'AND', filters }], groupJoin: 'AND',
      };
      window.BZ.segments.push(seg); U.Store.save();
      const r = S.reach(seg), rr = S.reachability(seg);
      location.hash = '#/segments/' + seg.id;
      return say(`<p>Built it — <strong>${U.num(r.count)} users</strong> match${r.count ? `, ${U.num(rr.email)} email-reachable` : ''}.</p>
        ${r.count === 0 ? '<p>That is an empty audience, which is worth understanding rather than just loosening at random.</p>' : ''}
        <p><strong>Why these filters:</strong></p><ul>${why.map((w) => `<li>${w}</li>`).join('')}</ul>
        ${r.count < 15 ? constraintReport(seg) : ''}
        <p class="bz-small">Every row is ANDed. Adjust or delete rows on the screen and the count updates live.</p>`,
        `Created segment <strong>${U.esc(seg.name)}</strong> with ${filters.length} filter${filters.length > 1 ? 's' : ''} and opened it.`);
    }

    /* -- add a filter to the open segment ---------------------------------- */
    if (/^(add|include|also)\b.*(filter|row)|^(add|also) (a )?(filter )?(for|on)\b/.test(q)) {
      if (!c.segment) return say(`<p>Open a segment first — I add filters to whatever is on screen. <a href="#/segments">Segments →</a></p>`);
      const { filters, why } = extractFilters(q);
      if (!filters.length) return say(`<p>I could not tell what to filter on. Try <em>"add a filter for app users"</em> or <em>"add a filter for points over 5000"</em>.</p>`);
      c.segment.filters.push.apply(c.segment.filters, filters);
      c.segment._edited = true; U.Store.save(); window.BZApp.render();
      const r = S.reach(c.segment);
      return say(`<p>Added. The segment is now <strong>${U.num(r.count)} users</strong>.</p><ul>${why.map((w) => `<li>${w}</li>`).join('')}</ul>`,
        `Added ${filters.length} filter${filters.length > 1 ? 's' : ''} to <strong>${U.esc(c.segment.name)}</strong>.`);
    }

    /* -- is this segment safe to send to ----------------------------------- */
    if (/(safe|ok|sanity|review|check).{0,24}(segment|audience|send)|audit (this )?segment/.test(q) && c.segment) {
      const f = c.segment.filters, rr = S.reachability(f), r = S.reach(f);
      const issues = [];
      if (!f.length) issues.push('No filters at all — this targets <strong>everyone</strong>. Almost never what you want.');
      if (!f.some((x) => x.field.startsWith('subscription.') || x.field === 'email_subscribe')) issues.push('No consent filter. Add a subscription-group row if this is promotional — Braze will not enforce it for you.');
      const started = f.find((x) => x.field === 'event.booking_started');
      const completed = f.find((x) => x.field === 'event.booking_completed' && x.op === 'not_performed_in_last_days');
      if (started && completed && Number(completed.value) < Number(started.value)) issues.push(`Window mismatch: you include ${started.value} days of starts but only exclude ${completed.value} days of completions. Someone who started <em>and</em> completed on day ${completed.value + 1} still qualifies. Make the exclusion window ≥ the inclusion window.`);
      if (r.pct > 60) issues.push(`This is ${r.pct.toFixed(0)}% of the entire base. Check that is deliberate.`);
      if (r.count === 0) issues.push('Zero users match. Usually two rows that cannot both be true — read them aloud with "and" between each.');
      if (rr.push < rr.total * 0.4) issues.push(`Only ${U.num(rr.push)} of ${U.num(rr.total)} are push-reachable, so do not promise the segment size for a push send.`);
      return say(`<p><strong>${U.esc(c.segment.name)}</strong> — ${U.num(r.count)} users, ${U.num(rr.email)} email-reachable.</p>
        ${issues.length ? `<p><strong>${issues.length} thing${issues.length > 1 ? 's' : ''} to look at:</strong></p><ol>${issues.map((i) => `<li>${i}</li>`).join('')}</ol>`
          : '<p>Nothing structural jumps out. Consent filter present, windows consistent, size plausible.</p>'}
        <p class="bz-small">I can only check the machine-checkable half. Links, timing and collisions with other sends are still on you — ask me for the full checklist.</p>`);
    }

    /* -- why is my segment empty / too small -------------------------------- */
    if (/(why|which).{0,30}(empty|zero|no users|nobody|too small|so small|dropped|shrunk|killing|constraint)/.test(q) ||
        /which filter/.test(q)) {
      if (!c.segment) return say('<p>Open the segment and ask again — I diagnose whatever is on screen. <a href="#/segments">Segments →</a></p>');
      const r = S.reach(c.segment);
      const rep = constraintReport(c.segment);
      return say(`<p><strong>${U.esc(c.segment.name)}</strong> currently matches <strong>${U.num(r.count)}</strong> of ${U.num(r.total)} profiles.</p>
        ${rep || '<p>No single filter is the culprit — the rows are each doing modest work and the combination is simply narrow.</p>'}
        <p class="bz-small">In production the other two causes are worth checking before you touch the filters: a campaign moved people out legitimately (they booked, so their <code>last_stay_date</code> is recent now), or an attribute stopped arriving — nulls fail date comparisons silently, so profiles drop out without any error.</p>`);
    }

    /* -- pre-launch check on a campaign ------------------------------------ */
    if (/(pre.?launch|launch check|ready to (send|launch)|audit|review).{0,20}(campaign)?/.test(q) && c.campaign) {
      const cp = c.campaign;
      const seg = window.BZ.segments.find((s) => s.id === cp.segmentId);
      const tpl = window.BZ.templates.find((t) => t.id === cp.templateId);
      const rr = seg ? S.reachability(seg) : { total: 0, email: 0, push: 0, sms: 0 };
      const lint = tpl ? window.BZLiquid.lint(tpl.body + '\n' + tpl.subject) : [];
      const rows = [
        [!!cp.conversionEvents.length, 'Conversion event set'],
        [rr.total > 0, 'Audience resolves to at least one user'],
        [cp.deliveryType !== 'action_based' || !!cp.trigger.exception, 'Action-based send has an exception event'],
        [!!tpl && /set_user_to_unsubscribed_url|aurelia_footer|unsubscribe/i.test(tpl.body), 'Unsubscribe link present'],
        [!!tpl && /\|\s*default\s*:/.test(tpl.body + tpl.subject), 'Personalization has a fallback'],
        [!!seg && seg.filters.some((x) => x.field.startsWith('subscription.')), 'Audience filters on a subscription group'],
      ];
      return say(`<p><strong>${U.esc(cp.name)}</strong> — ${U.num(rr.total)} in audience, ${U.num(cp.channels[0] === 'Push' ? rr.push : rr.email)} reachable on ${U.esc(cp.channels[0])}.</p>
        <ul>${rows.map(([ok, t]) => `<li>${ok ? '✅' : '❌'} ${t}</li>`).join('')}</ul>
        ${lint.length ? `<p><strong>Template linter:</strong></p><ul>${lint.map((i) => `<li>${U.esc(i.text)}</li>`).join('')}</ul>` : ''}
        <p class="bz-small">Still yours to do by hand: click every link, check UTMs, confirm nothing else big goes out the same day, and make sure the seed list is on.</p>`);
    }

    /* -- review a canvas ---------------------------------------------------- */
    if (/(review|check|audit|problem|wrong).{0,20}(canvas|journey|flow)/.test(q) || (/(review|check|audit)/.test(q) && c.canvas)) {
      if (!c.canvas) return say('<p>Open a Canvas and I will walk it. <a href="#/canvases">Canvases →</a></p>');
      const cv = c.canvas, issues = [];
      const flat = [];
      (function walk(list) { list.forEach((s) => { flat.push(s); (s.paths || []).forEach((p) => walk(p.steps)); }); })(cv.steps);

      const firstMsgIdx = flat.findIndex((s) => s.kind === 'message');
      const longAction = flat.find((s, i) => s.kind === 'action_paths' && i < firstMsgIdx);
      if (longAction) issues.push('An Action Paths step sits before your first message — every non-matching user waits out the whole evaluation window before receiving anything. Branch <em>after</em> the value is delivered.');
      flat.filter((s) => s.kind === 'action_paths').forEach((s) => {
        const d = parseInt(s.config.window, 10);
        if (d >= 5) issues.push(`"${U.esc(s.name)}" holds users for ${U.esc(s.config.window)}. Most email opens happen within 24h — a long window buys little signal for a large delay cost.`);
      });
      flat.filter((s) => s.kind === 'audience_paths').forEach((s) => {
        const last = (s.paths || [])[s.paths.length - 1];
        if (last && !/every|else|other|all/i.test(last.label)) issues.push(`"${U.esc(s.name)}" has no catch-all path. Audience Paths are first-match-wins, so anyone matching nothing drops out of the journey silently.`);
      });
      if (/before|until/.test(JSON.stringify(cv.steps)) && !flat.some((s) => /lead|short|soon/i.test(s.name)))
        issues.push('There is a delay relative to an attribute date ("until N days before arrival"). A booking made <em>inside</em> that window is already past the gate — add a lead-time branch near the top or those guests fall out.');
      if (!cv.entry.reeligibility.allow && /pre.?arrival|booking|stay/i.test(cv.name))
        issues.push('Re-eligibility is off on a booking-driven journey. A guest who books twice only ever gets one pre-arrival sequence.');
      if (!cv.entry.conversionEvents.length) issues.push('No conversion event — this journey can only be judged on opens and clicks, which is to say it cannot be judged.');

      return say(`<p><strong>${U.esc(cv.name)}</strong> — ${flat.length} steps, entry: ${U.esc(cv.entry.type.replace('_', '-'))}.</p>
        ${issues.length ? `<p><strong>${issues.length} thing${issues.length > 1 ? 's' : ''} worth fixing:</strong></p><ol>${issues.map((i) => `<li>${i}</li>`).join('')}</ol>`
          : '<p>Structurally sound — branches have catch-alls, no long waits before the first message, conversion event set.</p>'}`);
    }

    /* -- create a canvas / campaign ---------------------------------------- */
    if (/(create|build|make|new|start).{0,16}canvas|new journey/.test(q)) {
      const cv = {
        id: U.uid('cv'), name: 'Operator Canvas', status: 'draft', _userCreated: true,
        description: 'Started by the Operator. Configure entry, then build the flow.',
        entry: { type: 'action_based', trigger: 'Performs custom event `booking_completed`', segmentId: 'seg-all',
          reeligibility: { allow: true, cooldown: '1 day' }, entryWindow: 'Anytime',
          conversionEvents: [{ event: 'checked_in', window: '30 days', primary: true }],
          sendInUserTz: true, quietHours: '21:00 – 08:00' },
        stats: { entered: 0, converted: 0, revenue: 0 },
        steps: [window.BZCanvas.newStep('message'), window.BZCanvas.newStep('delay'),
                window.BZCanvas.newStep('audience_paths'), window.BZCanvas.newStep('exit')],
      };
      window.BZ.canvases.push(cv); U.Store.save(); location.hash = '#/canvases/' + cv.id;
      return say(`<p>Started you a Canvas with a sensible skeleton: message → delay → audience split → exit.</p>
        <p>Click the entry card first — trigger, entry audience, re-eligibility and conversion event are the settings that shape everything downstream. Then click <strong>+</strong> between steps to build the flow.</p>`,
        'Created a draft Canvas and opened it.');
    }
    if (/(create|build|make|new|start).{0,16}campaign/.test(q)) {
      window.BZApp.openWizard();
      const kind = /abandon/.test(q) ? 'abandonment' : /win.?back/.test(q) ? 'win-back' : /pre.?arrival/.test(q) ? 'pre-arrival' : null;
      if (kind === 'abandonment') {
        setTimeout(() => {
          Object.assign(window.BZApp.wizard, { name: 'Abandoned booking — 4h reminder', channel: 'Email',

        canvases: 'Canvas Flow. The entry card at the top holds the settings that shape everything: trigger, entry audience, re-eligibility, conversion event. Click any step to configure it, <strong>+</strong> to insert one. The number to watch in production is the <em>drop between steps</em> — that is where an Action Path window or a step-level filter is quietly removing people.',

        <button class="bz-op__send" type="submit" aria-label="Send">↑</button>
      </form>`;
    document.body.appendChild(panel);

    panel.querySelector('#bz-op-close').addEventListener('click', () => toggle(false));
    panel.querySelector('#bz-op-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const inp = document.getElementById('bz-op-in');
      const v = inp.value.trim();
      if (!v) return;
      inp.value = '';
      ask(v);
    });
    panel.querySelector('#bz-op-chips').addEventListener('click', (e) => {
      const chip = e.target.closest('.bz-op__chip');
      if (chip) ask(chip.textContent);
    });

    say(`<p>I am the sandbox operator. I answer questions about Braze <em>and</em> I build things — segments, campaigns, Canvas steps, Liquid — in the screens next to me.</p>

      <p class="bz-small">Not a live language model — this page has no model behind it. I match what you type against a curated set of topics and actions, and I tell you when I do not know.</p>`);
    paint();
  }

  function toggle(open) {
    isOpen = open === undefined ? !isOpen : open;
    document.getElementById('bz-op').classList.toggle('is-open', isOpen);
    document.body.classList.toggle('bz-op-open', isOpen);
    if (isOpen) { paint(); setTimeout(() => { const i = document.getElementById('bz-op-in'); if (i) i.focus(); }, 220); }
  }

  function ask(text) {
    youSaid(text);
    respond(text);
    paint();
  }

  function paint() {
    const logEl = document.getElementById('bz-op-log');
    if (!logEl) return;
    logEl.innerHTML = log.map((m) => `<div class="bz-op__msg bz-op__msg--${m.role}">${m.html}</div>`).join('');

    document.getElementById('bz-op-chips').innerHTML =
      chips.map((t) => `<button class="bz-op__chip">${U.esc(t)}</button>`).join('');
  }

  function onNavigate() { if (mounted) paint(); }

  return { mount, toggle, ask, onNavigate, respond };
})();

          <div class="bz-card__body">${U.funnel(o.channelMix.map((c) => ({ label: c.channel, value: c.sends, pct: c.pct + '%' })))}</div>
        </div>
      </div>

      <div class="bz-grid bz-grid--2">
        <div class="bz-card">
          <div class="bz-card__head"><div class="bz-card__title">Live campaigns</div><div class="bz-spacer"></div>
            <a class="bz-btn bz-btn--sm" href="#/campaigns">View all</a></div>
          <div class="bz-tablewrap"><table class="bz-table"><tbody>
            ${live.map((c) => `<tr class="is-clickable" data-go="#/campaigns/${c.id}">
              <td><div class="bz-table__name">${U.esc(c.name)}</div>
                  <div class="bz-table__meta">${U.esc(c.channels.join(', '))} · ${U.esc(c.deliveryType.replace('_', '-'))}</div></td>
              <td class="bz-nowrap">${U.num(c.stats.sent)} sent</td>
              <td class="bz-nowrap">${U.pct(c.stats.conversions, c.stats.sent)} conv</td>
            </tr>`).join('')}

        <div class="bz-card">
          <div class="bz-card__head"><div class="bz-card__title">Live Canvases</div><div class="bz-spacer"></div>
            <a class="bz-btn bz-btn--sm" href="#/canvases">View all</a></div>
          <div class="bz-tablewrap"><table class="bz-table"><tbody>
            ${liveCv.map((c) => `<tr class="is-clickable" data-go="#/canvases/${c.id}">
              <td><div class="bz-table__name">${U.esc(c.name)}</div>
                  <div class="bz-table__meta">${c.steps.length} steps</div></td>
              <td class="bz-nowrap">${U.num(c.stats.entered)} entered</td>
